# Configuration for cargo-dylint custom lint libraries.
# The local treetime_lints library reads its own sections here and falls back to
# built-in defaults when a section is absent.

# mordant: type-invariant lints (github.com/scarletindustries/mordant).
# All non-opt-in rule families (state, checks, errors, enums, duplication,
# naming, keys_locks, comments, unused) stay enabled; pre-existing findings are
# absorbed by the committed baseline so only new findings fail the mordant gate.
[mordant]
baseline = "mordant-baseline.toml"
[[mordant.forbidden-reach]]
from = "ancestral_reconstruction"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

[[mordant.forbidden-reach]]
from = "ancestral_reconstruction_fitch"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

[[mordant.forbidden-reach]]
from = "run_optimize_loop"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

[[mordant.forbidden-reach]]
from = "run_timetree"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

[[mordant.forbidden-reach]]
from = "compute_lineage_counts"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

# unnamed_constant (Trail of Bits, supplementary): flags integer literals that
# should be named constants. Raised above the default of 10 because this is a
# numerically dense codebase where small dimension, index, and exponent literals
# are idiomatic; the ceiling still catches genuinely opaque magic numbers.
[unnamed_constant]
threshold = 32

# no_comments / doc_comment_limit: the project keeps no comments, except doc
# comments that a configured render source carries into user-facing output (CLI
# help, JSON schema, OpenAPI, TypeScript typings). Each render source lists the
# derives and attributes that place an item on its surface, which doc comments
# it renders ("item", "fields", "variants"), and the attributes that drop a
# field or variant from that surface. A doc comment is kept when at least one
# render source still shows it. A rendered doc comment stays within the size
# limits below.
[no_comments]
allowed_comment_prefixes = ["SPDX-License-Identifier"]
max_chars = 500
max_lines = 6
max_paragraphs = 2

[[no_comments.rendered]]
name = "clap-command"
derives = ["Parser", "Args"]
renders = ["item", "fields"]
skip_attrs = ["arg(skip)"]

[[no_comments.rendered]]
name = "clap-subcommand"
derives = ["Subcommand"]
renders = ["item", "variants"]
skip_attrs = ["command(skip)", "arg(skip)"]

[[no_comments.rendered]]
name = "clap-value"
derives = ["ValueEnum"]
renders = ["variants"]
skip_attrs = ["value(skip)"]

[[no_comments.rendered]]
name = "schemars"
derives = ["JsonSchema"]
renders = ["item", "fields", "variants"]
skip_attrs = ["serde(skip)", "schemars(skip)"]

[[no_comments.rendered]]
name = "utoipa"
derives = ["ToSchema", "IntoParams", "ToResponse"]
attrs = ["utoipa::path"]
renders = ["item", "fields", "variants"]
skip_attrs = ["serde(skip)", "schema(ignore)", "param(ignore)"]

[[no_comments.rendered]]
name = "napi"
attrs = ["napi"]
renders = ["item", "fields", "variants"]
skip_attrs = ["napi(skip)", "napi(skip_typescript)"]
