# Configuration for cargo-dylint custom lint libraries.
# The local treetime_lints library reads its own sections here and falls back to
# built-in defaults when a section is absent.

# mordant: type-invariant lints (github.com/scarletindustries/mordant).
# All non-opt-in rule families (state, checks, errors, enums, duplication,
# naming, keys_locks, comments, unused) stay enabled; pre-existing findings are
# absorbed by the committed baseline so only new findings fail the mordant gate.
[mordant]
baseline = "mordant-baseline.toml"
[[mordant.forbidden-reach]]
from = "ancestral_reconstruction"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

[[mordant.forbidden-reach]]
from = "ancestral_reconstruction_fitch"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

[[mordant.forbidden-reach]]
from = "run_optimize_loop"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

[[mordant.forbidden-reach]]
from = "run_timetree"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

[[mordant.forbidden-reach]]
from = "compute_lineage_counts"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

# unnamed_constant (Trail of Bits, supplementary): flags integer literals that
# should be named constants. Raised above the default of 10 because this is a
# numerically dense codebase where small dimension, index, and exponent literals
# are idiomatic; the ceiling still catches genuinely opaque magic numbers.
[unnamed_constant]
threshold = 32

# no_comments / doc_comment_limit: the project keeps no comments except doc
# comments that clap, schemars, or utoipa render as help or schema text. Those
# derives and attributes are exempt; a rendered help doc comment stays within
# the size limits below.
[no_comments]
help_derives = ["Parser", "Args", "Subcommand", "JsonSchema", "ToSchema", "IntoParams", "ToResponse"]
help_variant_derives = ["ValueEnum"]
help_attrs = ["utoipa::path"]
max_chars = 300
max_lines = 3
max_paragraphs = 2
