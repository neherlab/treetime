# Configuration for cargo-dylint custom lint libraries.
# The local custom library reads its own sections here and falls back to
# built-in defaults when a section is absent.

# mordant: type-invariant lints (github.com/scarletindustries/mordant).
# The non-opt-in rule families state, checks, errors, enums, duplication,
# naming, keys_locks, and comments stay enabled; pre-existing findings are
# absorbed by the committed baseline so only new findings fail the mordant gate.
[mordant]
baseline = ".config/mordant-baseline.toml"
# unused_pub judges each library from the records of whichever crates cargo
# happened to compile before the reporting crate, so it reports items that
# sibling binaries use. The custom library's pub_unused_in_workspace and the
# pub-unused-report post-pass replace it.
disabled = ["unused_pub"]

# forbidden_reach: the inference algorithms of the treetime crate take their
# input as arguments and their randomness from the seed of the caller, so no
# call path from these entry points reaches the file system, the environment, a
# process, the clock, or an unseeded random source.
[[mordant.forbidden-reach]]
from = "ancestral_reconstruction"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

# Fitch parsimony reconstruction, packages/treetime/src/ancestral/fitch.rs
[[mordant.forbidden-reach]]
from = "ancestral_reconstruction_fitch"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

# branch length and model optimization, packages/treetime/src/optimize/run_loop.rs
[[mordant.forbidden-reach]]
from = "run_optimize_loop"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

# time tree inference, packages/treetime/src/timetree/inference/runner.rs
[[mordant.forbidden-reach]]
from = "run_timetree"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

# coalescent lineage counts, packages/treetime/src/coalescent/lineage_counts.rs
[[mordant.forbidden-reach]]
from = "compute_lineage_counts"
never = [
  "std::env::var",
  "std::fs::File::create",
  "std::fs::File::open",
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::process::Command::new",
  "std::time::SystemTime::now",
  "rand::random",
  "rand::thread_rng",
]

# unnamed_constant (Trail of Bits, supplementary): flags integer literals that
# should be named constants. Raised above the default of 10 because this is a
# numerically dense codebase where small dimension, index, and exponent literals
# are idiomatic; the ceiling still catches genuinely opaque magic numbers.
# Test code is exempt: grid sizes, sample counts, seeds, and expected values in a
# test read best next to the assertion that uses them.
[unnamed_constant]
threshold = 32
check_tests = false

# no_comments / doc_comment_limit: the project keeps no comments, except doc
# comments that a configured render source carries into user-facing output (CLI
# help, JSON schema, OpenAPI, TypeScript typings). Each render source lists the
# derives and attributes that place an item on its surface, which doc comments
# it renders ("item", "fields", "variants"), and the attributes that drop a
# field or variant from that surface. A doc comment is kept when at least one
# render source still shows it. A rendered doc comment stays within the size
# limits below.
#
# Comments that start with an allowed prefix are kept: license headers and the
# markers SAFETY (the invariants an unsafe block relies on), TODO, FIXME, and
# HACK (known gaps, defects, and workarounds, including disabled code kept as a
# comment). Line comments that directly follow a kept line comment, with no
# blank line or code between them, belong to the same note and are kept too.
[no_comments]
allowed_comment_prefixes = ["SPDX-License-Identifier", "SAFETY:", "TODO", "FIXME", "HACK"]
max_chars = 500
max_lines = 6
max_paragraphs = 2

[[no_comments.rendered]]
name = "clap-command"
derives = ["Parser", "Args"]
renders = ["item", "fields"]
skip_attrs = ["arg(skip)"]

[[no_comments.rendered]]
name = "clap-subcommand"
derives = ["Subcommand"]
renders = ["item", "variants"]
skip_attrs = ["command(skip)", "arg(skip)"]

[[no_comments.rendered]]
name = "clap-value"
derives = ["ValueEnum"]
renders = ["variants"]
skip_attrs = ["value(skip)"]

[[no_comments.rendered]]
name = "schemars"
derives = ["JsonSchema"]
renders = ["item", "fields", "variants"]
skip_attrs = ["serde(skip)", "schemars(skip)"]

[[no_comments.rendered]]
name = "napi"
attrs = ["napi"]
renders = ["item", "fields", "variants"]
skip_attrs = ["napi(skip)", "napi(skip_typescript)"]

# debug_remnants: the workspace logs with the log crate.
[debug_remnants]
suggested_framework = "log"

# proper_error_type: fallible functions return eyre::Report in every crate.
[proper_error_type]
style = "eyre"

# prefer_error_macros: the error helper macros of treetime-utils wrap eyre!
# with consistent formatting and internal-error annotations.
[prefer_error_macros]
helper_macros = ["make_error", "make_report", "make_internal_error", "make_internal_report"]
report_macro = "make_report"
error_macro = "make_error"
