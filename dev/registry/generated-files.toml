# Registry of committed generated files (A2).
#
# One entry per generated artifact group. Each records where the output comes
# from, the command that refreshes it, how staleness is detected, the full set
# of files the command emits, and which crate or script owns it. Files under
# target/, .build/, .cache/, node_modules/, dist/, and OUT_DIR are build
# products, not committed source, and are out of scope here.

[[generated]]
name = "json-schemas"
source = "schemars over the CLI argument types and the treetime-schema data types"
update_command = "just r treetime -- schema --for all -o packages/schemas"
freshness_check = "just generated-check; also the unit test test_schema_committed_files_match_generated in packages/app-cli/src/cli/schema.rs"
owner = "packages/app-cli (src/cli/schema.rs) and packages/treetime-schema"
output_set = [
  "packages/schemas/version-info.schema.json",
  "packages/schemas/progress-event.schema.json",
  "packages/schemas/error-response.schema.json",
  "packages/schemas/input-config-pipeline.schema.json",
  "packages/schemas/input-config-timetree.schema.json",
  "packages/schemas/input-config-optimize.schema.json",
  "packages/schemas/input-config-prune.schema.json",
  "packages/schemas/input-config-ancestral.schema.json",
  "packages/schemas/input-config-clock.schema.json",
  "packages/schemas/input-config-mugration.schema.json",
]

[[generated]]
name = "openapi-document"
source = "the utoipa and utoipa-axum annotations on the app-server request handlers"
update_command = "just openapi"
freshness_check = "just generated-check regenerates the document and byte-compares it against the committed copy"
owner = "packages/app-server (src/routes.rs, src/contract.rs, src/bin/generate-openapi.rs)"
output_set = ["packages/app-contracts/openapi.yaml"]

[[generated]]
name = "app-contracts-typescript"
source = "packages/app-contracts/openapi.yaml, via @hey-api/openapi-ts (TypeScript types and Zod schemas for the component definitions)"
update_command = "bun run --cwd packages/app-contracts generate"
freshness_check = "none"
owner = "packages/app-contracts (openapi-ts.config.ts)"
output_set = ["packages/app-contracts/src/generated/types.gen.ts", "packages/app-contracts/src/generated/zod.gen.ts"]

[[generated]]
name = "cli-reference-docs"
source = "the CLI help tree via 'treetime help-markdown'"
update_command = "just docs"
freshness_check = "CI regenerates and runs 'git diff --exit-code docs/docs/reference.md'"
owner = "docs/generate-reference-docs"
output_set = ["docs/docs/reference.md"]

[[generated]]
name = "cargo-lockfiles"
source = "the crate dependency graph"
update_command = "cargo update (workspace) / cargo update in dev/dylint"
freshness_check = "cargo builds run with --locked, which fails on drift"
owner = "cargo"
output_set = ["Cargo.lock", "dev/dylint/Cargo.lock"]

[[generated]]
name = "tool-lockfile"
source = "mise.toml"
update_command = "just tools-lock"
freshness_check = "dev/docker/checksum folds mise.lock into the image tag, so a change forces a rebuild"
owner = "mise"
output_set = ["mise.lock"]
