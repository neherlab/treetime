# The lints of the trailofbits/dylint examples that the project runs, vendored at the
# release tag of the pinned cargo-dylint. Each lint keeps its upstream crate and sources
# byte for byte; this package links them into one library through their `rlib` features.
[package]
name = "trailofbits"
version = "6.0.4"
authors = ["Samuel E. Moelius III <sam@moeli.us>"]
description = "Selected lints of the dylint examples: general, supplementary, and restriction"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trailofbits/dylint"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
assert_eq_arg_misordering = { path = "assert_eq_arg_misordering", features = ["rlib"] }
await_holding_span_guard = { path = "await_holding_span_guard", features = ["rlib"] }
crate_wide_allow = { path = "crate_wide_allow", features = ["rlib"] }
env_literal = { path = "env_literal", features = ["rlib"] }
try_io_result = { path = "try_io_result", features = ["rlib"] }
unnamed_constant = { path = "unnamed_constant", features = ["rlib"] }

dylint_linting = { workspace = true }

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]
members = ["*"]
exclude = [".cargo", "src"]

[workspace.dependencies]
assert_cmd = "2.2"
bitflags = "2.13"
clippy_utils = "=0.1.98"
derivative = "2.2.0"
dylint_internal = "=6.0.4"
dylint_linting = "=6.0.4"
dylint_testing = "=6.0.4"
once_cell = "1.21"
predicates = "3.1"
serde = "1.0"
serde_json = "1.0"
tracing = "0.1"

[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
option_if_let_else = "allow"
struct_field_names = "allow"

[workspace.lints.rust.unexpected_cfgs]
level = "deny"
check-cfg = ["cfg(dylint_lib, values(any()))"]
