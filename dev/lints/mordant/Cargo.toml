[package]
name = "mordant"
version = "0.1.0"
authors = ["Alistair Smith <alistairsmith01@gmail.com>"]
description = "Lints that find code where the type system is not enforcing the invariants the code depends on"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scarletindustries/mordant"
publish = false

[lib]
crate-type = ["cdylib"]

[lints.rust]
# dylint's driver sets `--cfg dylint_lib="<library>"` while it lints; a plain
# `cargo build` / `cargo clippy` does not. That is what lets this pack `allow`
# one of its own lints in its own source without `unknown_lints` firing when
# the pack is compiled off-driver.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dylint_lib, values("mordant"))'] }

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "9fca3bc9fc2bc83c60bde26d18ed68f11564b228" }
dylint_linting = "6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
dylint_testing = "6.0"

[package.metadata.rust-analyzer]
rustc_private = true

[workspace.metadata.dylint]
libraries = [{ path = "." }]
