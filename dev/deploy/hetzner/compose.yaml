# Web app stack of the nightly server. Each deploy installs this file in
# /opt/treetime/ (dev/deploy/hetzner/treetime-deploy), next to the .env file that
# holds TREETIME_TAG, TREETIME_DOMAIN, TREETIME_USER, and TREETIME_PASSWORD_HASH.
name: treetime

# The default json-file log driver never rotates its logs and fills the disk.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: treetime-web:${TREETIME_TAG:?}
    command:
      - --examples-dir=/app/data
      - --runs-dir=/runs
      - --max-upload-size=52428800
      # The server answers only the hosts it knows: `app` for the health check of
      # treetime-deploy, and the public domain that Caddy forwards.
      - --allowed-host=app
      - --allowed-host=${TREETIME_DOMAIN:?}
      - -j
      - "2"
    restart: unless-stopped
    logging: *logging
    # The server has no login and no limit on parallel runs; these limits bound
    # what one client can take from the host.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 2
    pids_limit: 256
    volumes:
      - ./runs:/runs
    # No healthcheck: the image has no shell or HTTP client. treetime-deploy
    # checks the health through the caddy container.

  caddy:
    image: treetime-caddy:${TREETIME_TAG:?}
    restart: unless-stopped
    logging: *logging
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      TREETIME_DOMAIN: ${TREETIME_DOMAIN:?}
      TREETIME_USER: ${TREETIME_USER:?}
      TREETIME_PASSWORD_HASH: ${TREETIME_PASSWORD_HASH:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  # Without IPv6 on the network, Docker forwards IPv6 connections through its
  # userland proxy, and Caddy sees the address of the network gateway in place
  # of the client: the rate limit of the Caddyfile would then count all IPv6
  # clients as one.
  default:
    enable_ipv6: true

volumes:
  caddy-data:
  caddy-config:
