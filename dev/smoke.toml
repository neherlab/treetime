# Cases of dev/smoke: every command, dataset and flag variant the smoke test runs.
#
# A case is one treetime invocation on one dataset. Its id is `<command>/<dataset>/<variant>`, for example
# `timetree/flu/h3n2/20/coalescent`. `./dev/smoke --list` prints the ids this file produces.
#
# Datasets are the directories holding `data/**/tree.nwk`. Their last path component is the number of sequences,
# which gives the size class, the default tier and the default timeout.
#
# Placeholders in arguments:
#   {data}       the data directory, `data`
#   {dataset}    the dataset directory, for example `{data}/flu/h3n2/20`
#   {metadata}   the metadata file of the dataset (`metadata.tsv` or `metadata.tsv.xz`)
#   {attribute}  the mugration attribute of the dataset family
#   {out}        the output directory of the case
#
# A command template that uses {metadata} or {attribute} runs only on datasets that have them. A row whose
# `datasets` names such a dataset explicitly is an error when the dataset lacks them.


# Random seed of every case whose command template is `seeded`. Profile sampling and polytomy resolution draw
# random numbers, and smoke compares the outputs byte for byte, so these commands need a fixed seed. A row passes
# its own `--seed=...` to use another one.
seed = 42


# Size classes by sequence count. A dataset belongs to the first class whose `max_sequences` it does not exceed.
# `tier`: quick cases run in `just smoke`, full cases only in `just smoke-all`. `timeout` is in seconds.
[sizes]
small = { max_sequences = 100, tier = "quick", timeout = 120 }
medium = { max_sequences = 500, tier = "full", timeout = 600 }
large = { tier = "full", timeout = 1800 }


# Dataset families, keyed by the dataset path without its size component. Every dataset needs a family.
#   metadata_args        added to every case whose command reads metadata, usually the taxon id column
#   mugration_attribute  metadata column that mugration reconstructs; mugration skips families without one
#   command_args         extra arguments per command
#   timeout_factor       multiplies the size timeout, for long genomes
[families.dengue]
metadata_args = "--name-column=genbank_accession"
mugration_attribute = "country"

[families.ebola]

[families."flu/h3n2"]
mugration_attribute = "location"

[families."lassa/L"]
metadata_args = "--name-column=accession"
mugration_attribute = "country"

[families."mpox/clade-ii"]
metadata_args = "--name-column=accession"
mugration_attribute = "country"
timeout_factor = 5.0

[families."rsv/a"]
metadata_args = "--name-column=accession"
mugration_attribute = "country"

[families.sc2]
metadata_args = "--name-column=strain"
mugration_attribute = "country"

[families.tb]
metadata_args = "--name-column=strain"
mugration_attribute = "cluster"

[families.zika]
mugration_attribute = "country"


# Command templates. A case runs `treetime <command>` with three layers of arguments: the template's `args` and
# `--output-selection=<selection>`, then the family arguments, then the row's `args` and `selection`. A flag in a
# later layer replaces every occurrence of the same flag in the earlier layers, so a row changes a template flag by
# passing it again, for example `--tree=...` or `--seed=...`. A flag may repeat within one layer.
# `outputs`: files that must exist and be non-empty after a run.
# `seeded`: true adds `--seed=<seed>` after the template's `args`, for commands with a random step.
#
# Every case writes every output of its command, so a change in any written file shows up. `ancestral` and
# `timetree` also write the leaf sequences (`--include-leaves`). A row sets its own `selection` only when the
# selection is what it tests, or when one output fails for a reason that its own row declares.
[commands.ancestral]
args = "--tree={dataset}/tree.nwk --aln={dataset}/aln.fasta.xz --output-all={out} --include-leaves"
seeded = true
outputs = ["ancestral.nwk"]
selection = "nwk,nexus,auspice,graph-json,dot,augur-node-data,gtr,reconstructed-nuc-fasta,reconstructed-aa-fasta,mat-pb,mat-json"

[commands.clock]
args = "--tree={dataset}/tree.nwk --dates={metadata} --output-all={out}"
outputs = ["clock.nwk"]
selection = "all"

[commands.homoplasy]
args = "--tree={dataset}/tree.nwk --aln={dataset}/aln.fasta.xz --output-all={out}"
outputs = ["homoplasy.nwk", "homoplasy.stats.json", "homoplasy.report.txt"]
selection = "all"

[commands.mugration]
args = "--tree={dataset}/tree.nwk --states={metadata} --attribute={attribute} --output-all={out}"
outputs = ["mugration.nwk"]
selection = "all"

[commands.optimize]
args = "--tree={dataset}/tree.nwk --aln={dataset}/aln.fasta.xz --output-all={out}"
outputs = ["optimize.nwk"]
selection = "nwk,nexus,auspice,graph-json,dot,augur-node-data,gtr,mat-pb,mat-json"

[commands.prune]
args = "--tree={dataset}/tree.nwk --aln={dataset}/aln.fasta.xz --output-all={out}"
outputs = ["prune.nwk"]
selection = "nwk,nexus,auspice,graph-json,dot,gtr,mat-pb,mat-json"

[commands.timetree]
args = "--tree={dataset}/tree.nwk --dates={metadata} --aln={dataset}/aln.fasta.xz --output-all={out} --include-leaves"
seeded = true
outputs = ["timetree.nwk"]
selection = "nwk,nexus,auspice,graph-json,dot,augur-node-data,gtr,reconstructed-nuc-fasta,clock-model,clock-csv,confidence-tsv,tracelog,coalescent-tsv,coalescent-csv,coalescent-json,mat-pb,mat-json"


# Rows, one `[[<command>]]` table per variant.
#   variant     last component of the case id (required)
#   datasets    "all" (default), a size class ("small", "medium", "large"), or a list of dataset names
#   args        arguments after the template and family arguments; a flag here replaces the same flag there
#   selection   `--output-selection` value; replaces the command default
#   standalone  true: `args` replaces the command template, its `selection` included, instead of following it;
#               only for rows that must leave out a template flag
#   outputs     replaces the command's required outputs
#   tier        "quick" or "full"; replaces the tier of the size class
#   timeout     seconds; replaces the timeout of the size class
#   fail        the case is expected to exit with an error: a reason for every dataset of the row, or a table of
#               reasons keyed by dataset. A reason names the kb entry that explains the failure
#   hang        the case is expected to exceed its timeout, in the same form as `fail`

