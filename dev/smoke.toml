# Amino-acid reconstruction of every CDS, from the translations that `data/translate` writes. The CDSes are listed
# because the GFF reader rejects the unstranded (`.`) CDS rows of this annotation.
# The template is a literal path because smoke checks every `{data}` path as one input file; the dataset directory
# is hashed as a whole, so the translations still key the case. `%GENE` keeps it clear of the smoke placeholders.
[[ancestral]]
variant = "translations"
datasets = ["rsv/a/20"]
args = "--method-anc=marginal --translations=data/rsv/a/20/translations/%GENE.fasta.xz --cdses=NS1,NS2,N,P,M,SH,G,F,M2-1,M2-2,L"
outputs = [
  "ancestral.nwk",
  "ancestral.reconstructed-aa.NS1.fasta",
  "ancestral.reconstructed-aa.NS2.fasta",
  "ancestral.reconstructed-aa.N.fasta",
  "ancestral.reconstructed-aa.P.fasta",
  "ancestral.reconstructed-aa.M.fasta",
  "ancestral.reconstructed-aa.SH.fasta",
  "ancestral.reconstructed-aa.G.fasta",
  "ancestral.reconstructed-aa.F.fasta",
  "ancestral.reconstructed-aa.M2-1.fasta",
  "ancestral.reconstructed-aa.M2-2.fasta",
  "ancestral.reconstructed-aa.L.fasta",
  "ancestral.mat.pb",
  "ancestral.mat.json",
]

# The amino-acid path with Fitch parsimony
[[ancestral]]
variant = "translations-parsimony"
datasets = ["rsv/a/20"]
args = "--method-anc=parsimony --translations=data/rsv/a/20/translations/%GENE.fasta.xz --cdses=NS1,NS2,N,P,M,SH,G,F,M2-1,M2-2,L"

