# MAT output with the transitions of ambiguous states
[[timetree]]
variant = "mat-report-ambiguous"
datasets = ["flu/h3n2/20", "tb/20", "zika/20"]
args = "--report-ambiguous"
selection = "mat-pb,mat-json"
outputs = ["timetree.mat.pb", "timetree.mat.json"]


# `treetime --help` and `treetime <subcommand> --help`; the printed text is compared with the baseline
[help]
subcommands = [
  "ancestral",
  "clock",
  "completions",
  "help-markdown",
  "homoplasy",
  "mugration",
  "optimize",
  "pipeline",
  "prune",
  "schema",
  "timetree",
]


# Every `<pattern>` file in a dataset directory is an example config and runs as
# `treetime <command> --config=<file> --output-all={out}` in a sandbox directory: the relative input paths of the file
# resolve from its folder, and the outputs go to the case. Files elsewhere, such as the fixtures in `data/smoke/`, are
# not examples. The command is `pipeline` for `pipeline.yaml`,
# otherwise the file name up to the first `-` (`ancestral-parsimony.yaml` runs `ancestral`).
[config]
pattern = "*.yaml"


# Commands without a dataset, one row per invocation. `args` follows the binary. The printed text is compared with the
# baseline; a `sandbox = true` row runs in a sandbox directory and its written files are compared instead.
[[cli]]
variant = "schema-timetree"
args = "schema --for=timetree --output=-"

[[cli]]
variant = "schema-pipeline"
args = "schema --for=pipeline --output=-"

[[cli]]
variant = "completions-bash"
args = "completions bash"

[[cli]]
variant = "completions-zsh"
args = "completions zsh"

[[cli]]
variant = "help-markdown"
args = "help-markdown"

[[cli]]
variant = "pipeline-check"
args = "pipeline --config={data}/zika/20/pipeline.yaml --check --output-all=tmp/pipeline-check"

[[cli]]
variant = "pipeline-steps-timetree"
args = "pipeline --config={data}/zika/20/pipeline.yaml --steps=timetree --output-all={out}"
sandbox = true
