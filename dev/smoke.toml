# Fixed clock on mpox, with the rerooted tree and with the input tree
[[timetree]]
variant = "fixed-clock-tree-opt"
datasets = ["mpox/clade-ii/1000"]
tree = "tree_opt.nwk"
args = "--clock-rate=5.7e-05 --clock-std-dev=2e-5 --divergence-units=mutations --seed=34234"

[[timetree]]
variant = "fixed-clock"
datasets = ["mpox/clade-ii/1000"]
args = "--clock-rate=5.7e-05 --clock-std-dev=2e-5 --divergence-units=mutations --seed=34234"


# A Nexus input tree
[[timetree]]
variant = "input-nexus-tree"
datasets = ["flu/h3n2/20"]
tree = "tree.nex"
fail = "kb/issues/M-io-nexus-and-phylip-input-unsupported.md"

# Tree output styles and all output formats
[[timetree]]
variant = "nwk-style-beast-nhx"
datasets = ["flu/h3n2/20"]
args = "--output-nwk-style=beast --output-nwk-style=nhx"
outputs = ["timetree.annotated.nwk", "timetree.nhx.nwk"]

[[timetree]]
variant = "all-outputs"
datasets = ["flu/h3n2/20"]
args = "--time-marginal=always"
selection = "all"


# `treetime --help` and `treetime <subcommand> --help`; the printed text is compared with the baseline
[help]
subcommands = [
  "ancestral",
  "arg",
  "clock",
  "completions",
  "help-markdown",
  "homoplasy",
  "mugration",
  "optimize",
  "pipeline",
  "prune",
  "schema",
  "timetree",
]


# Every `data/**/<pattern>` file runs as `treetime <command> --config=<file>` in a sandbox directory, so that the
# relative output paths of the file resolve inside the case. The command is `pipeline` for `pipeline.yaml`,
# otherwise the file name up to the first `-` (`ancestral-parsimony.yaml` runs `ancestral`).
[config]
pattern = "*.yaml"


# Commands without a dataset, one row per invocation. `args` follows the binary. The printed text is compared with the
# baseline; a `sandbox = true` row runs in a sandbox directory and its written files are compared instead.
[[cli]]
variant = "schema-timetree"
args = "schema --for=timetree --output=-"

[[cli]]
variant = "schema-pipeline"
args = "schema --for=pipeline --output=-"

[[cli]]
variant = "completions-bash"
args = "completions bash"

[[cli]]
variant = "completions-zsh"
args = "completions zsh"

[[cli]]
variant = "help-markdown"
args = "help-markdown"

[[cli]]
variant = "pipeline-check"
args = "pipeline --config={data}/zika/20/pipeline.yaml --check"

[[cli]]
variant = "pipeline-steps-timetree"
args = "pipeline --config={data}/zika/20/pipeline.yaml --steps=timetree"
sandbox = true
