# Fixed clock on mpox, with the rerooted tree and with the input tree
[[timetree]]
variant = "fixed-clock-tree-opt"
datasets = ["mpox/clade-ii/1000"]
args = "--tree={dataset}/tree_opt.nwk --clock-rate=5.7e-05 --divergence-units=mutations --seed=34234"

[[timetree]]
variant = "fixed-clock"
datasets = ["mpox/clade-ii/1000"]
args = "--clock-rate=5.7e-05 --divergence-units=mutations --seed=34234"

# A fixed clock rate thousands of times the rate of the data makes branch-time distributions so narrow that time
# inference needs grids above the grid point limit; the run stops with an error instead of exhausting memory
[[timetree]]
variant = "grid-point-limit"
datasets = ["mpox/clade-ii/20"]
args = "--clock-rate=0.5 --max-iter=1"
fail = "stops at the grid point limit: kb/decisions/distribution-grid-point-limit.md"


# A Nexus input tree
[[timetree]]
variant = "input-nexus-tree"
datasets = ["flu/h3n2/20"]
args = "--tree={dataset}/tree.nex"

# Tree output styles and all output formats
[[timetree]]
variant = "nwk-style-beast-nhx"
datasets = ["flu/h3n2/20"]
args = "--output-nwk-style=beast --output-nwk-style=nhx"
outputs = ["timetree.annotated.nwk", "timetree.nhx.nwk"]

[[timetree]]
variant = "all-outputs"
datasets = ["flu/h3n2/20"]
args = "--confidence"
