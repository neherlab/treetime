# cargo-nextest configuration. See https://nexte.st/docs/configuration/

[profile.default]
# Run every test, so one run reports all failures.
fail-fast = false
# Warn when a test runs longer than one period, and hard-terminate it after
# five periods (5 minutes), so a hung test cannot stall the run indefinitely.
slow-timeout = { period = "60s", terminate-after = 5 }
# Tests with a path segment that starts with `test_sim_` (simulation tests with
# many replicates: the test function, every rstest case below it, and every
# test of a `test_sim_` module) belong to the slow tier: only the `slow`
# profile runs them. A command-line filter narrows this set further.
default-filter = 'not test(/(^|::)test_sim_/)'

# CI profile: emit a JUnit report under $CARGO_TARGET_DIR/nextest/ci/.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

# Slow tier: only the tests with a `test_sim_` path segment, run by
# `just test-slow-rs`. Each test is designed to finish within 10 minutes
# on an unloaded host. On a shared, loaded build host the same tests take
# several times longer, so the safety stop terminates a test only after
# 40 minutes.
[profile.slow]
default-filter = 'test(/(^|::)test_sim_/)'
slow-timeout = { period = "60s", terminate-after = 40 }

# Each simulation test runs its replicates on its own rayon pool of
# `REPLICATE_THREADS` threads (`packages/treetime/src/test_utils/simulation.rs`).
# Weigh every test by that count, so nextest does not oversubscribe the CPUs.
# Keep this value equal to `REPLICATE_THREADS`.
[[profile.slow.overrides]]
filter = 'all()'
threads-required = 8
