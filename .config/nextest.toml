# cargo-nextest configuration. See https://nexte.st/docs/configuration/

[profile.default]
# Run every test, so one run reports all failures.
fail-fast = false
# Warn when a test runs longer than one period, and hard-terminate it after
# five periods (5 minutes), so a hung test cannot stall the run indefinitely.
slow-timeout = { period = "60s", terminate-after = 5 }
# Test functions whose names start with `test_sim_` (simulation recovery tests
# with many replicates) belong to the slow tier, with all their rstest cases:
# only the `slow` profile runs them. A command-line filter narrows this set
# further.
default-filter = 'not test(/::test_sim_[^:]*(::case_[^:]*)?$/)'

# CI profile: emit a JUnit report under $CARGO_TARGET_DIR/nextest/ci/.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

# Slow tier: only the `test_sim_` test functions, run by `just test-slow-rs`.
# Terminate a test after 20 minutes.
[profile.slow]
default-filter = 'test(/::test_sim_[^:]*(::case_[^:]*)?$/)'
slow-timeout = { period = "60s", terminate-after = 20 }
