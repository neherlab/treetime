openblas-aarch64-pc-windows-gnullvm = "github:binarylandia/build_openblas"
openblas-aarch64-unknown-linux-gnu = "github:binarylandia/build_openblas"
openblas-aarch64-unknown-linux-musl = "github:binarylandia/build_openblas"
openblas-mt-wasm32-unknown-emscripten = "github:binarylandia/build_openblas"
