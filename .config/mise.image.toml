# Build toolchains and prebuilt libraries of the Docker images in dev/docker/.
# Each image copies this file and .config/mise.image.lock into a folder of its
# own and installs the tools it needs with dev/docker/files/install-image-tools
# and the libraries of its targets with
# dev/docker/files/install-image-libraries, at the URL and checksum of the
# lockfile. Hosts do not load this file; `just tools-lock-image` locks it
# (MISE_ENV=image) for linux-x64, the only platform of the images.

[settings]
lockfile = true
locked = true

[tool_alias]
gcc-aarch64-unknown-linux-gnu = "github:binarylandia/build_crosstool-ng"
gcc-aarch64-unknown-linux-musl = "github:binarylandia/build_crosstool-ng"
gcc-x86_64-unknown-linux-gnu = "github:binarylandia/build_crosstool-ng"
gcc-x86_64-unknown-linux-musl = "github:binarylandia/build_crosstool-ng"
gcc-x86_64-w64-mingw32 = "github:binarylandia/build_crosstool-ng"
liblzma-aarch64-apple-darwin = "github:binarylandia/staticbourg"
liblzma-aarch64-pc-windows-gnullvm = "github:binarylandia/staticbourg"
liblzma-aarch64-unknown-linux-gnu = "github:binarylandia/staticbourg"
liblzma-aarch64-unknown-linux-musl = "github:binarylandia/staticbourg"
liblzma-wasm32-unknown-emscripten = "github:binarylandia/staticbourg"
liblzma-x86_64-apple-darwin = "github:binarylandia/staticbourg"
liblzma-x86_64-pc-windows-gnullvm = "github:binarylandia/staticbourg"
liblzma-x86_64-unknown-linux-gnu = "github:binarylandia/staticbourg"
liblzma-x86_64-unknown-linux-musl = "github:binarylandia/staticbourg"
liblzma-x86_64-win7-windows-gnu = "github:binarylandia/staticbourg"
libzstd-aarch64-apple-darwin = "github:binarylandia/staticbourg"
libzstd-aarch64-pc-windows-gnullvm = "github:binarylandia/staticbourg"
libzstd-aarch64-unknown-linux-gnu = "github:binarylandia/staticbourg"
libzstd-aarch64-unknown-linux-musl = "github:binarylandia/staticbourg"
libzstd-wasm32-unknown-emscripten = "github:binarylandia/staticbourg"
libzstd-x86_64-apple-darwin = "github:binarylandia/staticbourg"
libzstd-x86_64-pc-windows-gnullvm = "github:binarylandia/staticbourg"
libzstd-x86_64-unknown-linux-gnu = "github:binarylandia/staticbourg"
libzstd-x86_64-unknown-linux-musl = "github:binarylandia/staticbourg"
libzstd-x86_64-win7-windows-gnu = "github:binarylandia/staticbourg"
llvm = "github:binarylandia/build_llvm"
llvm-mingw = "github:binarylandia/build_llvm"
openblas-aarch64-apple-darwin = "github:binarylandia/build_openblas"
openblas-aarch64-pc-windows-gnullvm = "github:binarylandia/build_openblas"
openblas-aarch64-unknown-linux-gnu = "github:binarylandia/build_openblas"
openblas-aarch64-unknown-linux-musl = "github:binarylandia/build_openblas"
openblas-mt-wasm32-unknown-emscripten = "github:binarylandia/build_openblas"
openblas-wasm32-unknown-emscripten = "github:binarylandia/build_openblas"
openblas-x86_64-apple-darwin = "github:binarylandia/build_openblas"
openblas-x86_64-pc-windows-gnullvm = "github:binarylandia/build_openblas"
openblas-x86_64-unknown-linux-gnu = "github:binarylandia/build_openblas"
openblas-x86_64-unknown-linux-musl = "github:binarylandia/build_openblas"
openblas-x86_64-win7-windows-gnu = "github:binarylandia/build_openblas"
