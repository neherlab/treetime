min_version = "2026.9.10"

[settings]
lockfile = true
locked = true
minimum_release_age = "7d"
# Releases of the project's own binarylandia organization are exempt from the
# seven-day wait; their upstream sources still follow it.
minimum_release_age_excludes = [
  "github:binarylandia/appville",
  "github:binarylandia/build_crosstool-ng",
  "github:binarylandia/build_llvm",
  "github:binarylandia/build_openblas",
  "github:binarylandia/build_osxcross",
  "github:binarylandia/staticbourg",
]

[tool_alias]
cargo-dylint = "github:trailofbits/dylint"
dylint-link = "github:trailofbits/dylint"
liblzma = "github:binarylandia/staticbourg"
openblas = "github:binarylandia/build_openblas"
wasm-bindgen = "github:binarylandia/appville"

[tools]
actionlint = "1.7.12"
bun = "1.4.3"
cargo-deny = "0.20.2"
hadolint = "2.15.1"
hyperfine = "1.20.0"
jq = "1.8.2"
just = "1.58.0"
mold = { version = "2.42.1", os = ["linux"] }
node = "24.22.1"
pixi = "0.81.0"
protoc = "28.3"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
taplo = "0.10.0"
yq = "4.53.6"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.145"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"cargo:cargo-edit" = "0.13.13"
"github:Boshen/cargo-shear" = "1.13.4"
"github:astral-sh/hawk" = { version = "0.1.14", exe = "cargo-hawk" }
"github:kucherenko/jscpd" = "5.2.1"
"github:kunobi-ninja/kache" = "0.28.1"
"github:shenwei356/seqkit" = "2.13.0"
"github:sourcefrog/cargo-mutants" = "27.1.0"
cargo-dylint = { version = "6.0.4", os = ["linux"], matching = "cargo-dylint-" }
dylint-link = { version = "6.0.4", os = ["linux"], matching = "dylint-link-" }

[tools."github:iqtree/iqtree3"]
version = "3.1.4"

[tools."github:iqtree/iqtree3".platforms]
linux-arm64 = { asset_pattern = "iqtree-{{ version }}-Linux-arm.tar.gz" }
linux-x64 = { asset_pattern = "iqtree-{{ version }}-Linux-intel.tar.gz" }
macos-arm64 = { asset_pattern = "iqtree-{{ version }}-macOS-arm.zip" }
macos-x64 = { asset_pattern = "iqtree-{{ version }}-macOS-intel.zip" }

# The wasm-bindgen CLI that emcc runs on the WebAssembly back end, built by
# binarylandia/appville (tasks/wasm-bindgen) from upstream with a patch for
# threaded Emscripten modules. The version is the release tag without its
# prefix; its first part must equal the wasm-bindgen crate in Cargo.toml.
[tools.wasm-bindgen]
version = "0.2.129-2026-10-27_23-17-27"
version_prefix = "wasm-bindgen-"
bin_path = "bin"

[tools.wasm-bindgen.platforms]
linux-arm64 = { asset_pattern = "wasm-bindgen-*-static-aarch64-unknown-linux-musl-*.tar.gz" }
linux-x64 = { asset_pattern = "wasm-bindgen-*-static-x86_64-unknown-linux-musl-*.tar.gz" }
macos-arm64 = { asset_pattern = "wasm-bindgen-*-static-aarch64-apple-darwin-*.tar.gz" }
macos-x64 = { asset_pattern = "wasm-bindgen-*-static-x86_64-apple-darwin-*.tar.gz" }

# The static OpenBLAS (with the static Fortran runtime of flang that its LAPACK
# calls) and liblzma of binarylandia, the archives that the shipped builds link,
# for native builds on hosts. HOST_PKG_CONFIG_PATH puts their pkg-config files
# before the user's PKG_CONFIG_PATH for native builds only, so the build scripts
# of treetime-openblas and liblzma-sys link them; without them, the build links
# the OpenBLAS and liblzma of the system. libzstd keeps the bundled sources of
# zstd-sys on hosts: zstd-sys asks pkg-config whenever ZSTD_SYS_USE_PKG_CONFIG
# exists, even empty, and fails without a libzstd.pc. The images set their
# pkg-config paths in /.cargo/config.toml (dev/docker/files/install-image-libraries)
# and disable these two tools.
[tools.openblas]
version = "0.3.34-432-gde5d4914-2026-10-27_20-39-30"
version_prefix = "openblas-"

[tools.openblas.platforms]
linux-arm64 = { asset_pattern = "openblas-static-[0-9]*-aarch64-unknown-linux-gnu-*.tar.xz" }
linux-x64 = { asset_pattern = "openblas-static-[0-9]*-x86_64-unknown-linux-gnu-*.tar.xz" }
macos-arm64 = { asset_pattern = "openblas-static-[0-9]*-aarch64-apple-darwin-*.tar.xz" }
macos-x64 = { asset_pattern = "openblas-static-[0-9]*-x86_64-apple-darwin-*.tar.xz" }

[tools.liblzma]
version = "2026-10-27_19-17-50"

[tools.liblzma.platforms]
linux-arm64 = { asset_pattern = "lzma-[0-9]*-static-aarch64-unknown-linux-gnu-*.tar.xz" }
linux-x64 = { asset_pattern = "lzma-[0-9]*-static-x86_64-unknown-linux-gnu-*.tar.xz" }
macos-arm64 = { asset_pattern = "lzma-[0-9]*-static-aarch64-apple-darwin-*.tar.xz" }
macos-x64 = { asset_pattern = "lzma-[0-9]*-static-x86_64-apple-darwin-*.tar.xz" }

[env]
HOST_PKG_CONFIG_PATH = { value = """\
{%- set sep = "" -%}
{%- if tools.openblas %}{{ tools.openblas.path }}/lib/pkgconfig{% set sep = ":" %}{% endif -%}
{%- if tools.liblzma %}{{ sep }}{{ tools.liblzma.path }}/lib/pkgconfig{% set sep = ":" %}{% endif -%}
{%- set user = get_env(name="PKG_CONFIG_PATH", default="") -%}
{%- if user %}{{ sep }}{{ user }}{% endif -%}""", tools = true }
