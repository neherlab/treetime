min_version = "2026.9.10"

[settings]
lockfile = true
locked = true
minimum_release_age = "7d"
# Releases of the project's own binarylandia organization are exempt from the
# seven-day wait; their upstream sources still follow it.
minimum_release_age_excludes = [
  "github:binarylandia/appville",
  "github:binarylandia/build_crosstool-ng",
  "github:binarylandia/build_llvm",
  "github:binarylandia/build_osxcross",
  "github:binarylandia/wine_bcryptprimitives_dll_mock",
]

[tool_alias]
cargo-dylint = "github:trailofbits/dylint"
dylint-link = "github:trailofbits/dylint"
wasm-bindgen = "github:binarylandia/appville"

[tools]
actionlint = "1.7.12"
bun = "1.4.3"
cargo-deny = "0.20.2"
hadolint = "2.15.1"
hyperfine = "1.20.0"
jq = "1.8.2"
just = "1.58.0"
mold = { version = "2.42.1", os = ["linux"] }
node = "24.22.1"
pixi = "0.81.0"
protoc = "28.3"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
taplo = "0.10.0"
yq = "4.53.6"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.145"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"cargo:cargo-edit" = "0.13.13"
"github:Boshen/cargo-shear" = "1.13.4"
"github:astral-sh/hawk" = { version = "0.1.14", exe = "cargo-hawk" }
"github:kucherenko/jscpd" = "5.2.1"
"github:kunobi-ninja/kache" = "0.28.1"
"github:shenwei356/seqkit" = "2.13.0"
"github:sourcefrog/cargo-mutants" = "27.1.0"
cargo-dylint = { version = "6.0.4", os = ["linux"], matching = "cargo-dylint-" }
dylint-link = { version = "6.0.4", os = ["linux"], matching = "dylint-link-" }

[tools."github:iqtree/iqtree3"]
version = "3.1.4"

[tools."github:iqtree/iqtree3".platforms]
linux-arm64 = { asset_pattern = "iqtree-{{ version }}-Linux-arm.tar.gz" }
linux-x64 = { asset_pattern = "iqtree-{{ version }}-Linux-intel.tar.gz" }
macos-arm64 = { asset_pattern = "iqtree-{{ version }}-macOS-arm.zip" }
macos-x64 = { asset_pattern = "iqtree-{{ version }}-macOS-intel.zip" }

# The wasm-bindgen CLI that emcc runs on the WebAssembly back end, built by
# binarylandia/appville (tasks/wasm-bindgen) from upstream with a patch for
# threaded Emscripten modules. The version is the release tag without its
# prefix; its first part must equal the wasm-bindgen crate in Cargo.toml.
[tools.wasm-bindgen]
version = "0.2.129-2026-10-15_15-08-39"
version_prefix = "wasm-bindgen-"
bin_path = "bin"

[tools.wasm-bindgen.platforms]
linux-arm64 = { asset_pattern = "wasm-bindgen-*-static-aarch64-unknown-linux-musl-*.tar.gz" }
linux-x64 = { asset_pattern = "wasm-bindgen-*-static-x86_64-unknown-linux-musl-*.tar.gz" }
macos-arm64 = { asset_pattern = "wasm-bindgen-*-static-aarch64-apple-darwin-*.tar.gz" }
macos-x64 = { asset_pattern = "wasm-bindgen-*-static-x86_64-apple-darwin-*.tar.gz" }
