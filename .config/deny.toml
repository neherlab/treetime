# cargo-deny policy. Advisories and yanked crates are checked by the network
# `just audit` recipe (it fetches the advisory database); `just check-all` runs
# the offline bans, licenses, and sources checks.

# Dependency checks cover the targets the project builds: the CLI cross-compilation matrix in
# `dev/cross/all`, which includes the Node addon targets. Crates used only on other platforms
# (UEFI, Redox, WebAssembly, MSVC, 32-bit Windows) are outside the shipped graph.
[graph]
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-gnullvm",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-gnullvm",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

# Duplicate versions are denied so a newly introduced duplicate fails the check. Each `skip` entry
# names an older version that an upstream crate still requires at its latest release, so no version
# choice in this workspace can remove it. The ranges cover only the older version: a new duplicate
# still fails, and cargo-deny reports an entry that no longer matches once upstream catches up.
[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openblas-src", reason = "treetime-openblas owns the OpenBLAS link through pkg-config" },
  { crate = "serde_yaml", reason = "upstream is archived; YAML is parsed with serde-saphyr" },
  { crate = "time", reason = "dates are owned by chrono and chronoutil" },
  { crate = "xml", reason = "XML is serialized and parsed with quick-xml" },
]
skip = [
  { crate = "bit-set:<0.9", reason = "intervallum 1.4.4, proptest, and fancy-regex require bit-set 0.8; every gcollections release that intervallum accepts requires another version (1.5: 0.5, 1.6: 0.9)" },
  { crate = "bit-vec:<0.9", reason = "bit-set 0.8, required by intervallum 1.4.4, proptest, and fancy-regex" },
  { crate = "bitflags:<2", reason = "plotters 0.3.7 requires font-kit 0.14.3, whose macOS backend requires core-graphics 0.23, which requires bitflags 1" },
  { crate = "block-buffer:<0.12", reason = "headers 0.4 requires sha1 0.10 and its digest 0.10 stack; sha2 0.11 requires digest 0.11" },
  { crate = "convert_case:<0.11", reason = "derive_more 2 requires convert_case 0.7 or 0.10; napi-derive 3.5.2 and later require 0.11 or newer" },
  { crate = "core-foundation:<0.10", reason = "plotters 0.3.7 requires font-kit 0.14.3, whose macOS backend requires core-graphics 0.23 and core-foundation 0.9; rustls-platform-verifier requires 0.10" },
  { crate = "cpufeatures:<0.3", reason = "headers 0.4 requires sha1 0.10 and its digest 0.10 stack; sha2 0.11 requires digest 0.11" },
  { crate = "crypto-common:<0.2", reason = "headers 0.4 requires sha1 0.10 and its digest 0.10 stack; sha2 0.11 requires digest 0.11" },
  { crate = "digest:<0.11", reason = "headers 0.4 requires sha1 0.10 and its digest 0.10 stack; sha2 0.11 requires digest 0.11" },
  { crate = "getrandom:<0.4", reason = "rand 0.8 requires getrandom 0.2; every jsonschema release requires getrandom 0.3 through ahash; rand 0.10 requires getrandom 0.4" },
  { crate = "libloading:<0.9", reason = "plotters 0.3.7 requires font-kit 0.14.3, whose fontconfig backend requires dlib 0.5 and its libloading 0.8; napi-sys requires 0.9" },
  { crate = "rand:<0.10", reason = "cauchy, num-complex, ndarray-linalg 0.18, and ndarray-stats 0.7 require rand 0.8; proptest requires rand 0.9; TreeTime uses rand 0.10" },
  { crate = "rand_core:<0.10", reason = "rand 0.8 requires rand_core 0.6; argmin 0.11 (through rand_xoshiro 0.7) and proptest require rand_core 0.9; rand 0.10 requires rand_core 0.10" },
  { crate = "syn:<3", reason = "most proc-macro crates, including serde_derive at the pinned serde version, require syn 2; saphyr 0.0.12 requires thiserror 2.0.20, whose derive requires syn 3" },
  { crate = "tower-http:<0.7", reason = "reqwest 0.13.4 requires tower-http 0.6; axum and the server use 0.7" },
  { crate = "unicode-width:<0.2", reason = "miette 7.6 requires unicode-width 0.1; comfy-table, console, indicatif, and textwrap require 0.2" },
  { crate = "windows-sys:<0.61", reason = "textplots 0.8.7 requires drawille 0.3, which requires colored 2, which requires windows-sys 0.59" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
