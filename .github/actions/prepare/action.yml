name: "Prepare the build container"
description: "Free disk space, restore the cargo and compiler caches, and pull or build the container image"

inputs:
  image:
    description: "Image of dev/docker/run: native, or a release target of dev/cross/targets"
    default: "native"
  cache:
    description: "Name of the compiler cache of this job"
    required: true
  dockerhub-username:
    description: "Docker Hub user; with a token, the image and its layer cache are pushed"
    default: ""
  dockerhub-token:
    description: "Docker Hub token; empty on pull requests from forks"
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Free disk space"
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
        df -h /

    - name: "Log in to Docker Hub"
      if: ${{ inputs.dockerhub-token != '' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: "Set up Docker Buildx"
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: "Restore the cargo registry"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/cargo/registry/index/
          .cache/cargo/registry/cache/
          .cache/cargo/git/db/
        key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-registry-

    - name: "Restore the compiler cache"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/kache/
        key: kache-${{ inputs.cache }}-${{ inputs.image }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: kache-${{ inputs.cache }}-${{ inputs.image }}-

    - name: "Pull or build the image"
      shell: bash
      env:
        CROSS_COMPILE: ${{ inputs.image }}
        TREETIME_DOCKER_PUSH: ${{ inputs.dockerhub-token != '' && '1' || '' }}
      run: dev/docker/run true
