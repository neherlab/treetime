name: "Build CLI"

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Immutable source commit to build"
        required: true
        type: string
      build_mode:
        description: "CLI build version mode: dev, nightly, or release"
        required: true
        type: string
      version_suffix:
        description: "Version suffix for TREETIME_VERSION_SUFFIX"
        required: false
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  TREETIME_BUILD_MODE: ${{ inputs.build_mode }}
  TREETIME_VERSION_SUFFIX: ${{ inputs.version_suffix }}

jobs:
  build-cli:
    name: "Build CLI (${{ matrix.target }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # A nightly publishes every target that builds; the Linux x86_64 binary is required.
    continue-on-error: ${{ inputs.build_mode == 'nightly' && matrix.target != 'x86_64-unknown-linux-gnu' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - x86_64-pc-windows-gnu
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl

    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}

      - name: "Prepare the build container"
        uses: ./.github/actions/prepare
        with:
          image: ${{ matrix.target }}
          cache: release
          dockerhub-username: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ github.event_name != 'pull_request' && secrets.NEHERLAB_BOT_DOCKERHUB_TOKEN || '' }}

      - name: "Build"
        env:
          CROSS_COMPILE: ${{ matrix.target }}
        run: |
          dev/docker/run dev/cross/build treetime
          dev/docker/run dev/cross/check treetime

      - name: "Upload"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: treetime-${{ matrix.target }}
          path: .out/treetime-${{ matrix.target }}*
          if-no-files-found: error
