name: "CI"

on:
  push:
    branches:
      - rust
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  KACHE_STORE: ${{ github.workspace }}/.cache/kache
  FORCE_COLOR: "1"

jobs:
  # The checks of `just check-all` except hawk, split into parallel jobs. Each job
  # runs its recipes in the build container through dev/run-checks.
  check:
    name: "Check (${{ matrix.name }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "format and config lints"
            recipes: "fmt-check deny shear lint-shell lint-docker lint-toml lint-workflows fixtures-check"
          - name: "clippy"
            recipes: "lint"
          - name: "custom lints"
            recipes: "dylint"
          - name: "tests"
            recipes: "test"
          - name: "generated files"
            recipes: "generated-check"
          - name: "typescript"
            recipes: "typecheck lint-js knip test-js"

    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Prepare the build container"
        uses: ./.github/actions/prepare
        with:
          cache: ${{ matrix.name }}
          dockerhub-username: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ github.event_name == 'push' && secrets.NEHERLAB_BOT_DOCKERHUB_TOKEN || '' }}

      - name: "Run ${{ matrix.recipes }}"
        run: dev/docker/run bash -c "just _js && TREETIME_JS_READY=1 dev/run-checks --serial ${{ matrix.recipes }}"

  build-cli:
    name: "Build CLI"
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/cli-build.yml
    with:
      source_ref: ${{ github.sha }}
      build_mode: dev
    secrets: inherit

  compat-linux:
    name: "Compat test (${{ matrix.target }})"
    needs: [build-cli]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            script: dev/test-linux-distros-gnu
          - target: x86_64-unknown-linux-musl
            script: dev/test-linux-distros-musl
    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Download build artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: treetime-${{ matrix.target }}
          path: .out

      - name: "Run on Linux distributions"
        run: |
          chmod +x ".out/treetime-${{ matrix.target }}"
          ${{ matrix.script }} ".out/treetime-${{ matrix.target }}" --help

  compat-macos:
    name: "Compat test (macOS, ${{ matrix.name }})"
    needs: [build-cli]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "x86_64"
            runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - name: "aarch64, macos-14"
            runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64
          - name: "aarch64, macos-latest"
            runner: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
    steps:
      - name: "Download build artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: treetime-${{ matrix.target }}
          path: .out

      - name: "Run the binary"
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          chmod +x ".out/treetime-${{ matrix.target }}"
          ".out/treetime-${{ matrix.target }}" --help

  compat-windows:
    name: "Compat test (Windows)"
    needs: [build-cli]
    runs-on: windows-2022
    steps:
      - name: "Download build artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: treetime-x86_64-pc-windows-gnu
          path: .out

      - name: "Run the binary"
        shell: pwsh
        run: .\.out\treetime-x86_64-pc-windows-gnu.exe --help
