name: "CI"

on:
  push:
    branches:
      - rust
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  # Every run starts without incremental state, so incremental compiles only add
  # overhead, and kache caches only compiles without it.
  CARGO_INCREMENTAL: "0"
  KACHE_STORE: ${{ github.workspace }}/.cache/kache
  FORCE_COLOR: "1"

jobs:
  # The check groups of `just check-all` except hawk, one parallel job each. The
  # justfile owns the recipes of each group; `just check-group` runs them in the
  # build container through dev/run-checks.
  check:
    name: "Check (${{ matrix.name }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "format and config lints"
            group: "format"
          - name: "clippy"
            group: "clippy"
          - name: "custom lints"
            group: "dylint"
          - name: "tests"
            group: "tests"
          - name: "generated files"
            group: "generated"
          - name: "typescript"
            group: "typescript"

    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Prepare the build container"
        uses: ./.github/actions/prepare
        with:
          cache: ${{ matrix.name }}
          dockerhub-username: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ github.event_name == 'push' && secrets.NEHERLAB_BOT_DOCKERHUB_TOKEN || '' }}

      - name: "Run the ${{ matrix.group }} checks"
        run: dev/docker/run just check-group ${{ matrix.group }}

  # Every push to rust builds and tests the CLI once, in nightly.yml. A manual
  # run builds and tests it here, for a branch before it lands.
  build-cli:
    name: "Build CLI"
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/cli-build.yml
    with:
      source_ref: ${{ github.sha }}
      build_mode: dev
    secrets: inherit

  compat:
    name: "Test CLI compatibility"
    needs: build-cli
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/cli-compat.yml
    with:
      source_ref: ${{ github.sha }}
    secrets: inherit
