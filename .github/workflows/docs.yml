# Build the docs site and deploy it with deploy-site.yml to https://docs.treetime.neherlab.org/dev and to the preview
# sites https://<site>.docs.previews.treetime.neherlab.org/dev.
name: "Docs site"

on:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - "opened"
      - "reopened"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: "bash -euo pipefail {0}"

env:
  CARGO_INCREMENTAL: "0"
  KACHE_STORE: "${{ github.workspace }}/.cache/kache"
  FORCE_COLOR: "1"

jobs:
  build:
    name: "Build the docs site"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    permissions:
      contents: "read"
    concurrency:
      group: "docs-build-${{ github.event.pull_request.number || github.ref }}"
      cancel-in-progress: true
    steps:
      - name: "Check out"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          persist-credentials: false

      - name: "Prepare the build container"
        uses: "./.github/actions/prepare"
        with:
          cache: "docs"
          dockerhub-username: "${{ secrets.NEHERLAB_BOT_DOCKERHUB_USERNAME }}"
          dockerhub-token: "${{ github.event_name == 'push' && github.ref == 'refs/heads/rust' && secrets.NEHERLAB_BOT_DOCKERHUB_TOKEN || '' }}"

      - name: "Build"
        run: "dev/docker/run just build-docs"

      - name: "Pack the build"
        run: "tar -cf site.tar packages/app-docs/dist packages/app-docs/dist-root"

      - name: "Store the build"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: "docs-site"
          path: "site.tar"
          if-no-files-found: "error"
          retention-days: 7

  deploy:
    name: "Deploy the docs site"
    needs: "build"
    if: "github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository"
    permissions:
      contents: "read"
      id-token: "write"
      pull-requests: "write"
    uses: "./.github/workflows/deploy-site.yml"
    with:
      name: "docs"
      title: "Docs"
      artifact: "docs-site"
      dist: "packages/app-docs/dist"
      root-files: "packages/app-docs/dist-root"
      routing: "pages"
      prefix: "dev"
      production-folder: "docs.treetime.neherlab.org"
      previews-folder: "docs.previews.treetime.neherlab.org"
    secrets:
      PRODUCTION_AWS_ROLE_ARN: "${{ secrets.TREETIME_DOCS_AWS_ROLE_ARN }}"
      PRODUCTION_AWS_REGION: "${{ secrets.TREETIME_DOCS_AWS_REGION }}"
      PRODUCTION_AWS_S3_BUCKET: "${{ secrets.TREETIME_DOCS_AWS_S3_BUCKET }}"
      PRODUCTION_AWS_CLOUDFRONT_DISTRIBUTION_ID: "${{ secrets.TREETIME_DOCS_AWS_CLOUDFRONT_DISTRIBUTION_ID }}"
      PREVIEWS_AWS_ROLE_ARN: "${{ secrets.TREETIME_DOCS_PREVIEWS_AWS_ROLE_ARN }}"
      PREVIEWS_AWS_REGION: "${{ secrets.TREETIME_DOCS_PREVIEWS_AWS_REGION }}"
      PREVIEWS_AWS_S3_BUCKET: "${{ secrets.TREETIME_DOCS_PREVIEWS_AWS_S3_BUCKET }}"
      PREVIEWS_AWS_CLOUDFRONT_DISTRIBUTION_ID: "${{ secrets.TREETIME_DOCS_PREVIEWS_AWS_CLOUDFRONT_DISTRIBUTION_ID }}"
