name: "Nightly release"

# Runs on every push to rust, and when the daily scheduler of
# schedule-nightly.yml on master or dev/trigger-nightly calls it. Each run builds
# the CLI once and deploys every binary that builds: the release, then the Docker
# images. The compatibility tests run on the same binaries and report problems
# without holding back a deployment.
on:
  push:
    branches:
      - rust

  workflow_call:
    inputs:
      force:
        description: "Build even when source has not changed since the latest nightly"
        required: false
        type: boolean
        default: false
      # The scheduler on master passes this input. Every nightly releases the CLI,
      # so the value has no effect.
      only:
        description: "Ignored: every nightly releases the CLI"
        required: false
        type: string
        default: "all"

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: nightly-cli-release
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: neherlab/treetime-nightly

jobs:
  prepare:
    name: "Resolve rust revision"
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version_suffix: ${{ steps.prepare.outputs.version_suffix }}
    steps:
      - name: "Resolve version"
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.NEHERLAB_BOT_GITHUB_TOKEN }}
          FORCE: ${{ inputs.force == true }}
        run: |
          source_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/rust" --jq '.sha')
          short_sha="${source_sha:0:7}"
          latest_tag=$(gh api "repos/${RELEASE_REPOSITORY}/releases?per_page=100" --jq '[.[] | select((.draft | not) and (.tag_name | contains("-nightly.")))][0].tag_name // ""')

          should_build=true
          if [[ "${FORCE}" != "true" && -n "${latest_tag}" && "${latest_tag}" == *"+${short_sha}" ]]; then
            should_build=false
          fi

          timestamp=$(date -u "+%Y%m%dT%H%M%SZ")
          version_suffix="nightly.${timestamp}+${short_sha}"

          printf "Source: %s\nVersion suffix: %s\nBuild: %s\n" "${source_sha}" "${version_suffix}" "${should_build}"
          printf "should_build=%s\nsource_sha=%s\nversion_suffix=%s\n" \
            "${should_build}" "${source_sha}" "${version_suffix}" >> "${GITHUB_OUTPUT}"

  # The build jobs continue on error in nightly mode, so a failed target never
  # blocks the others: the release contains every CLI binary that builds.
  build:
    name: "Build"
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    uses: neherlab/treetime/.github/workflows/cli-build.yml@rust
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      build_mode: nightly
      version_suffix: ${{ needs.prepare.outputs.version_suffix }}
    secrets: inherit

  publish:
    name: "Publish nightly release"
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.outputs.should_build == 'true' }}
    runs-on: ubuntu-24.04
    # The attest action signs with the identity of this workflow. A called workflow can only lower the
    # permissions of its caller, so the nightly job of schedule-nightly.yml on master grants the same ones.
    # The release upload uses NEHERLAB_BOT_GITHUB_TOKEN, not this token.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: "Checkout rust revision"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: "Download build artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "treetime-*"
          merge-multiple: true
          path: ".out"

      # Exactly the files that data/index.json lists, plus the index itself, so the archive and the index
      # cannot differ and the desktop app finds the index in the unpacked folder. Paths stay relative to
      # data/ (zika/20/tree.nwk). Deflate entries, which the zip reader of treetime supports.
      - name: "Archive example datasets"
        working-directory: data
        run: |
          { jq -r '.files[].path' index.json; echo index.json; } | zip -X -D -q -Z deflate -@ ../.out/examples.zip

      # Covers every file that the publish step uploads from .out. The glob expands before the redirection
      # creates SHA256SUMS, so the file does not list itself.
      - name: "Generate checksums"
        working-directory: ".out"
        run: |
          sha256sum -- * > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: "Generate build provenance attestations"
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ".out/SHA256SUMS"

      - name: "Publish nightly release"
        env:
          GITHUB_TOKEN: ${{ secrets.NEHERLAB_BOT_GITHUB_TOKEN }}
        run: |
          ./dev/publish-nightly \
            --artifacts_dir ".out" \
            --source_repo "${GITHUB_REPOSITORY}" \
            --release_repo "${RELEASE_REPOSITORY}" \
            --git_sha "${{ needs.prepare.outputs.source_sha }}" \
            --version_suffix "${{ needs.prepare.outputs.version_suffix }}"

  # The Nextstrain runtimes download the latest release as treetime1 when they
  # build, so they are rebuilt once the release is published.
  nextstrain-runtimes:
    name: "Rebuild Nextstrain runtimes"
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions: {}
    uses: neherlab/treetime/.github/workflows/nextstrain-runtimes.yml@rust
    secrets: inherit

  compat:
    name: "Test CLI compatibility"
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.outputs.should_build == 'true' }}
    uses: neherlab/treetime/.github/workflows/cli-compat.yml@rust
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit

  # The images copy the Linux CLI binaries of this run without a new compilation.
  # Each image is pushed for every platform whose binary built, and then runs its
  # tests, so a failed binary or test reports a problem but never holds back the
  # other images.
  docker:
    name: "Publish to Docker Hub"
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.outputs.should_build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: "Checkout rust revision"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: "Log in to Docker Hub"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_USERNAME }}
          password: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_TOKEN }}

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: "Download the Linux binaries"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "treetime-{x86_64,aarch64}-unknown-linux-{gnu,musl}"
          merge-multiple: true
          path: ".out"

      - name: "Build and push the images, then run them"
        env:
          VERSION_SUFFIX: ${{ needs.prepare.outputs.version_suffix }}
        run: dev/docker/prod-images --version-suffix "${VERSION_SUFFIX}" --push --run
