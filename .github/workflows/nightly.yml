name: "Nightly release and web deploy"

on:
  workflow_call:
    inputs:
      force:
        description: "Build even when source has not changed since the latest nightly"
        required: false
        type: boolean
        default: false
      only:
        description: "What to run: cli (CLI release), desktop (desktop app release), web (web app deploy), or all"
        required: false
        type: string
        default: "all"

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: nightly-cli-release
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: neherlab/treetime-nightly

jobs:
  prepare:
    name: "Resolve rust revision"
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version_suffix: ${{ steps.prepare.outputs.version_suffix }}
    steps:
      - name: "Resolve version"
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.NEHERLAB_BOT_GITHUB_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          case "${ONLY}" in
          cli | desktop | web | all) ;;
          *)
            printf 'Invalid input only: "%s". Expected cli, desktop, web, or all\n' "${ONLY}" >&2
            exit 1
            ;;
          esac

          source_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/rust" --jq '.sha')
          short_sha="${source_sha:0:7}"
          # Only a release with CLI binaries counts, so a desktop-only release
          # does not make the next scheduled run skip the CLI.
          latest_tag=$(gh api "repos/${RELEASE_REPOSITORY}/releases?per_page=100" --jq '[.[] | select((.draft | not) and (.tag_name | contains("-nightly.")) and any(.assets[]; .name | startswith("treetime-") and (startswith("treetime-desktop-") | not)))][0].tag_name // ""')

          should_build=true
          if [[ "${{ inputs.force }}" != "true" && "${ONLY}" != "desktop" && -n "${latest_tag}" && "${latest_tag}" == *"+${short_sha}" ]]; then
            should_build=false
          fi

          timestamp=$(date -u "+%Y%m%dT%H%M%SZ")
          version_suffix="nightly.${timestamp}+${short_sha}"

          printf "Source: %s\nVersion suffix: %s\nBuild: %s\n" "${source_sha}" "${version_suffix}" "${should_build}"
          printf "should_build=%s\nsource_sha=%s\nversion_suffix=%s\n" \
            "${should_build}" "${source_sha}" "${version_suffix}" >> "${GITHUB_OUTPUT}"

  build:
    name: "Build"
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true' && (inputs.only == 'cli' || inputs.only == 'all')
    uses: neherlab/treetime/.github/workflows/cli-build.yml@rust
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      build_mode: nightly
      version_suffix: ${{ needs.prepare.outputs.version_suffix }}
    secrets: inherit

  # The build jobs continue on error in nightly mode, so a failed target never
  # blocks the others: the release contains every CLI binary and desktop
  # package that builds.
  build-desktop:
    name: "Build desktop app"
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true' && (inputs.only == 'desktop' || inputs.only == 'all')
    uses: neherlab/treetime/.github/workflows/desktop-build.yml@rust
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      build_mode: nightly
      version_suffix: ${{ needs.prepare.outputs.version_suffix }}
    secrets: inherit

  publish:
    name: "Publish nightly release"
    needs: [prepare, build, build-desktop]
    if: ${{ !cancelled() && needs.prepare.outputs.should_build == 'true' && inputs.only != 'web' }}
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout rust revision"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: "Download build artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "treetime-*"
          merge-multiple: true
          path: ".out"

      # The example datasets of data/, one entry per dataset folder (zika/20/tree.nwk), without the smoke
      # fixtures and the development scripts. Deflate entries, which the zip reader of treetime supports.
      - name: "Archive example datasets"
        run: |
          (cd data && zip -r -X -D -q ../.out/examples.zip . -x 'smoke/*' 'subsample' 'translate' 'usher-download-examples')

      - name: "Publish nightly release"
        env:
          GITHUB_TOKEN: ${{ secrets.NEHERLAB_BOT_GITHUB_TOKEN }}
        run: |
          ./dev/publish-nightly \
            --artifacts_dir ".out" \
            --source_repo "${GITHUB_REPOSITORY}" \
            --release_repo "${RELEASE_REPOSITORY}" \
            --git_sha "${{ needs.prepare.outputs.source_sha }}" \
            --version_suffix "${{ needs.prepare.outputs.version_suffix }}"

  # Independent of build and publish, so a failure of the web deploy or of the
  # CLI release never blocks the other. should_build compares only with the
  # latest CLI release, so the cron deploys exactly when a CLI nightly is built,
  # and a manual web-only run always deploys.
  deploy-web:
    name: "Deploy web app"
    needs: prepare
    if: (inputs.only == 'all' && needs.prepare.outputs.should_build == 'true') || inputs.only == 'web'
    uses: neherlab/treetime/.github/workflows/web-deploy.yml@rust
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit
