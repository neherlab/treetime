name: "Nightly release and web deploy"

on:
  workflow_call:
    inputs:
      force:
        description: "Build even when source has not changed since the latest nightly"
        required: false
        type: boolean
        default: false
      only:
        description: "What to run: cli (CLI and desktop release), web (web app deploy), or both"
        required: false
        type: string
        default: "both"

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: nightly-cli-release
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: neherlab/treetime-nightly

jobs:
  prepare:
    name: "Resolve rust revision"
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version_suffix: ${{ steps.prepare.outputs.version_suffix }}
    steps:
      - name: "Resolve version"
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.NEHERLAB_BOT_GITHUB_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          case "${ONLY}" in
          cli | web | both) ;;
          *)
            printf 'Invalid input only: "%s". Expected cli, web, or both\n' "${ONLY}" >&2
            exit 1
            ;;
          esac

          source_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/rust" --jq '.sha')
          short_sha="${source_sha:0:7}"
          latest_tag=$(gh release list --repo "${RELEASE_REPOSITORY}" --exclude-drafts --limit 100 --json tagName --jq '[.[] | select(.tagName | contains("-nightly."))][0].tagName // ""')

          should_build=true
          if [[ "${{ inputs.force }}" != "true" && -n "${latest_tag}" && "${latest_tag}" == *"+${short_sha}" ]]; then
            should_build=false
          fi

          timestamp=$(date -u "+%Y%m%dT%H%M%SZ")
          version_suffix="nightly.${timestamp}+${short_sha}"

          printf "Source: %s\nVersion suffix: %s\nBuild: %s\n" "${source_sha}" "${version_suffix}" "${should_build}"
          printf "should_build=%s\nsource_sha=%s\nversion_suffix=%s\n" \
            "${should_build}" "${source_sha}" "${version_suffix}" >> "${GITHUB_OUTPUT}"

  build:
    name: "Build"
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true' && inputs.only != 'web'
    uses: neherlab/treetime/.github/workflows/cli-build.yml@rust
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      build_mode: nightly
      version_suffix: ${{ needs.prepare.outputs.version_suffix }}
    secrets: inherit

  # The desktop jobs continue on error in nightly mode, so a desktop failure
  # never blocks the CLI release; only desktop packages that passed their start
  # test are uploaded as treetime-desktop-<target> and published.
  build-desktop:
    name: "Build desktop app"
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true' && inputs.only != 'web'
    uses: neherlab/treetime/.github/workflows/desktop-build.yml@rust
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      build_mode: nightly
      version_suffix: ${{ needs.prepare.outputs.version_suffix }}
    secrets: inherit

  publish:
    name: "Publish nightly release"
    needs: [prepare, build, build-desktop]
    if: ${{ !cancelled() && needs.prepare.outputs.should_build == 'true' && inputs.only != 'web' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout rust revision"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: "Download build artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "treetime-*"
          merge-multiple: true
          path: ".out"

      - name: "Publish nightly release"
        env:
          GITHUB_TOKEN: ${{ secrets.NEHERLAB_BOT_GITHUB_TOKEN }}
        run: |
          ./dev/publish-nightly \
            --artifacts_dir ".out" \
            --source_repo "${GITHUB_REPOSITORY}" \
            --release_repo "${RELEASE_REPOSITORY}" \
            --git_sha "${{ needs.prepare.outputs.source_sha }}" \
            --version_suffix "${{ needs.prepare.outputs.version_suffix }}"

  # Independent of build and publish, so a failure of the web deploy or of the
  # CLI release never blocks the other. should_build compares only with the
  # latest CLI release, so the cron deploys exactly when a CLI nightly is built,
  # and a manual web-only run always deploys.
  deploy-web:
    name: "Deploy web app"
    needs: prepare
    if: inputs.only != 'cli' && (needs.prepare.outputs.should_build == 'true' || inputs.only == 'web')
    uses: neherlab/treetime/.github/workflows/web-deploy.yml@rust
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
    secrets: inherit
