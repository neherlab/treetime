name: "Nightly CLI and desktop"

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Build even when source has not changed since the latest nightly"
        required: false
        type: boolean
        default: false
      only:
        description: "What to run: cli (CLI release), desktop (desktop app release), or all"
        required: false
        type: choice
        options:
          - all
          - cli
          - desktop
        default: all

permissions:
  contents: read

jobs:
  nightly:
    uses: neherlab/treetime/.github/workflows/nightly.yml@rust
    with:
      force: ${{ inputs.force || false }}
      # The cron has no inputs and runs all.
      only: ${{ inputs.only || 'all' }}
    secrets: inherit
