name: "Nightly CLI and web"

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Build even when source has not changed since the latest nightly"
        required: false
        type: boolean
        default: false
      only:
        description: "What to run: cli (CLI release), web (web app deploy), or both"
        required: false
        type: choice
        options:
          - both
          - cli
          - web
        default: both

permissions:
  contents: read

jobs:
  nightly:
    uses: neherlab/treetime/.github/workflows/nightly.yml@rust
    with:
      force: ${{ inputs.force || false }}
      # The cron has no inputs and runs both.
      only: ${{ inputs.only || 'both' }}
    secrets: inherit
