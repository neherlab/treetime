# cargo-deny policy. Advisories and yanked crates are checked by the network
# `just audit` recipe (it fetches the advisory database); `just check-full` runs
# the offline bans, licenses, and sources checks.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "bzip2-1.0.6", "ISC", "MIT", "MIT-0", "MPL-2.0", "Unicode-3.0", "Zlib"]

# `multiple-versions` reports rather than denies: the tree carries transitive
# duplicate versions (for example thiserror and syn 1.x and 2.x) that come in
# through third-party and git dependencies and are out of this policy's reach.
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [{ crate = "serde_yaml", reason = "upstream is archived; YAML is parsed with serde-saphyr" }, { crate = "xml", reason = "XML is serialized and parsed with quick-xml" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/argmin-rs/argmin", "https://github.com/numrs/lapack-sys", "https://github.com/numrs/ndarray-linalg", "https://github.com/numrs/openblas-src"]
