[workspace]
resolver = '3'

members = [
  "packages/app-cli",
  "packages/app-datasets",
  "packages/app-napi",
  "packages/app-output",
  "packages/app-server",
  "packages/treetime",
  "packages/treetime-analytical",
  "packages/treetime-distribution",
  "packages/treetime-graph",
  "packages/treetime-grid",
  "packages/treetime-io",
  "packages/treetime-ops",
  "packages/treetime-schema",
  "packages/treetime-primitives",
  "packages/treetime-utils",
  "packages/treetime-validation",
  "packages/util-augur-node-data-json",
  "packages/util-phyloxml",
  "packages/util-newick",
  "packages/util-usher-mat",
]

exclude = ["dev/templates/rust-crate"]

[workspace.metadata.dylint]
libraries = [
  { path = "dev/lints/dylint-custom" },
  { path = "dev/lints/dylint-mordant" },
  { path = "dev/lints/dylint-trailofbits" },
]


[workspace.package]
description = "Maximum-likelihood phylodynamic inference"
version = "1.0.0"
documentation = "https://treetime.readthedocs.io/en/stable/"
repository = "https://github.com/neherlab/treetime"
homepage = "https://github.com/neherlab/treetime"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
keywords = ["biology", "evolution", "phylogenetics", "phylogeography", "virus"]
authors = ["NeherLab <https://neherlab.org>", "Richard Neher", "Pavel Sagulenko", "Emma Hodcroft", "Ivan Aksamentov"]


[patch.crates-io]
lapack-sys = { git = "https://github.com/numrs/lapack-sys", rev = "d3b1ca9" }
lax = { git = "https://github.com/numrs/ndarray-linalg", rev = "ac7052e" }
ndarray-linalg = { git = "https://github.com/numrs/ndarray-linalg", rev = "ac7052e" }
openblas-src = { git = "https://github.com/numrs/openblas-src", rev = "0964a10" }

argmin = { git = "https://github.com/argmin-rs/argmin", rev = "f5c3fd3" }
argmin-math = { git = "https://github.com/argmin-rs/argmin", rev = "f5c3fd3" }

# This table is the single list of dependency owners: one crate per job, no separate owners
# document.
#
# YAML has two owners on purpose: serde-saphyr reads and writes typed values, and saphyr owns the
# byte-span index that places carets in configuration diagnostics. serde-saphyr cannot report source
# positions, so both stay.
#
# Reserved owners, added here when their first caller lands, so nothing unused is pinned now: reqwest
# with reqwest-middleware and reqwest-retry for the HTTP client, backon for retry around non-HTTP
# operations, and globwalk for globbing.
[workspace.dependencies]
blas-src = { version = "=0.12.1", features = ["openblas-src"] }
ndarray = { version = "=0.16.1", features = ["rayon", "serde", "approx", "blas"] }
ndarray-linalg = { version = "=0.17.0", features = ["openblas-system"] }
ndarray-rand = "=0.15.0"
ndarray-stats = "=0.6.0"
openblas-src = { version = "=0.10.12", features = ["system"] }

bzip2 = { version = "=0.6.1", features = ["static"] }
flate2 = "=1.1.9"
xz2 = { version = "=0.1.7", features = ["static"] }
zstd = { version = "=0.13.3", features = ["zstdmt"] }

approx = "=0.5.1"
argmin = "=0.10.0"
argmin-math = { version = "=0.4.0", features = ["ndarray_v0_16", "ndarray-linalg_0_17"] }
async-stream = "=0.3.6"
auto_ops = "=0.3.0"
axum = { version = "=0.8.9", features = ["json"] }
bio = { version = "=2.3.0", features = ["phylogeny"] }
bon = "=3.9.3"
bytes = { version = "=1.12.1", features = ["serde"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "alloc", "std", "serde"] }
chronoutil = "=0.2.7"
clap = { version = "=4.6.7", features = ["derive"] }
clap-markdown = "=0.1.5"
clap_complete = "=4.6.11"
clap_complete_fig = "=4.5.2"
color-eyre = "=0.6.5"
comfy-table = "=7.2.1"
criterion = { version = "=0.7.0", features = ["html_reports"] }
crossbeam-channel = "=0.5.17"
crossterm = "=0.29.0"
csv = "=1.4.0"
ctor = "=1.0.13"
derive_more = { version = "=2.1.1", features = ["full"] }
env_logger = "=0.11.11"
eyre = "=0.6.14"
gcollections = "=1.6.0"
getset = "=0.1.7"
