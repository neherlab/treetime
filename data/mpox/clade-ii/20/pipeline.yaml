# Nextstrain-style mpox build: branch-length optimization, then ancestral reconstruction.
#
# Run from the repository root:
#   treetime pipeline --config data/mpox/clade-ii/20/pipeline.yaml
#
# Resolve the whole plan (inputs, outputs, chained paths) without running anything:
#   treetime pipeline --config data/mpox/clade-ii/20/pipeline.yaml --check
#
# On the Nextstrain mpox `WIP/new_tt` phylogenetic workflow, `treetime optimize`
# replaces `augur refine` (branch-length optimization only) and `treetime
# ancestral` folds in `augur translate`. This one file runs both steps in one
# process, on one dataset, with no snakemake, augur, or shell glue.
#
# `vars` names shared values once. `{{ steps.optimize.outputs.nwk }}` resolves
# to the optimized tree the first step writes, so the second step never repeats
# a path. `output_all` gives each step its own `<dir>/<step>/` output directory.

vars:
  data: "data/mpox/clade-ii/20"

output_all: "tmp/examples/mpox/clade-ii/20/pipeline"

steps:
  # Re-estimate branch lengths and reroot on the min-divergence branch.
  - name: "optimize"
    optimize:
      tree: "{{ vars.data }}/tree.nwk"
      alignment:
        alignment:
          - "{{ vars.data }}/aln.fasta.xz"
      model_args:
        model: "infer"
      reroot: "min-dev"
      # mpox is measured in absolute substitutions rather than per-site rates.
      divergence_units: "mutations"

  # Reconstruct ancestral sequences and map mutations onto the optimized tree.
  - name: "ancestral"
    ancestral:
      tree: "{{ steps.optimize.outputs.nwk }}"
      alignment:
        alignment:
          - "{{ vars.data }}/aln.fasta.xz"
      method_anc: "marginal"
      model_args:
        model: "infer"
