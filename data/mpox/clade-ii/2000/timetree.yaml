# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-timetree.schema.json

# Time tree with the default settings (mpox/clade-ii/2000).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime timetree --config data/mpox/clade-ii/2000/timetree.yaml --output-all tmp/examples/mpox/clade-ii/2000/timetree
#
# `timetree` estimates the clock rate of 1989 clade II mpox genomes, reroots the tree,
# and dates every node. `seed` makes the random order of the polytomy resolution
# reproducible.

tree: "tree.nwk"
metadata: "metadata.tsv"
metadata_id_columns:
  - "accession"
alignment:
  - "aln.fasta.xz"

seed: 42
