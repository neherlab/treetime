# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-mugration.schema.json

# Ancestral sampling country (mpox/clade-ii/2000).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime mugration --config data/mpox/clade-ii/2000/mugration-country.yaml --output-all tmp/examples/mpox/clade-ii/2000/mugration-country
#
# Discrete-trait reconstruction of the sampling country, 32 states.

tree: "tree.nwk"
metadata: "metadata.tsv"
metadata_id_columns:
  - "accession"
attribute: "country"
