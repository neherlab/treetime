# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-homoplasy.schema.json

# Homoplasies with the default settings (tb/149).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime homoplasy --config data/tb/149/homoplasy.yaml --output-all tmp/examples/tb/149/homoplasy
#
# `homoplasy` reconstructs the ancestral sequences of 149 TB isolates at 216
# informative sites and reports the mutations that arise more than once on the tree, a
# sign of recombination, convergent evolution, or sequencing errors.

tree: "tree.nwk"
alignment:
  - "aln.fasta.xz"
