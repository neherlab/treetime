# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-timetree.schema.json

# Time tree with the default settings (tb/149).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime timetree --config data/tb/149/timetree.yaml --output-all tmp/examples/tb/149/timetree
#
# `timetree` estimates the clock rate of 149 TB isolates at 216 informative sites,
# reroots the tree, and dates every node. `seed` makes the random order of the
# polytomy resolution reproducible.

tree: "tree.nwk"
metadata: "metadata.tsv"
alignment:
  - "aln.fasta.xz"

seed: 42
