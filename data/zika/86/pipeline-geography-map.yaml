# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-pipeline.schema.json

# Zika virus spread in the Americas: time tree, then weighted ancestral geography (zika/86).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime pipeline --config data/zika/86/pipeline-geography-map.yaml --output-all tmp/examples/zika/86/pipeline-geography-map
#
# Preview the plan, or rerun only the second step after editing it:
#   treetime pipeline --config data/zika/86/pipeline-geography-map.yaml --dry-run --output-all tmp/examples/zika/86/pipeline-geography-map
#   treetime pipeline --config data/zika/86/pipeline-geography-map.yaml --steps mugration --output-all tmp/examples/zika/86/pipeline-geography-map
#
# 86 Zika virus genomes sampled from 2013 to 2016. Step 1 dates the tree under a
# constant coalescent with the 90% intervals of the node dates; `seed` makes the
# random order of the polytomy resolution reproducible. Step 2 reconstructs the
# sampling country (18 states) on the dated tree. The number of sequences per
# country differs much between countries, so `weights` gives the equilibrium
# probability of each country (`../country_weights.csv`, one weight per country).
# `lat_longs` gives the coordinates of each country (`../country_lat_longs.tsv`),
# and `output_selection` adds the Auspice tree to the default outputs, so the step
# writes a tree that Auspice shows with the countries on a map.

steps:
  # 1. Date the tree and fit a constant coalescent time scale.
  - name: "timetree"
    timetree:
      tree: "tree.nwk"
      metadata: "metadata.tsv"
      alignment:
        - "aln.fasta.xz"
      coalescent: "opt"
      confidence: true
      seed: 42

  # 2. Reconstruct the sampling country with a prior weight per country.
  - name: "mugration"
    mugration:
      tree: "{{ steps.timetree.outputs.nwk }}"
      metadata: "metadata.tsv"
      attribute: "country"
      weights: "../country_weights.csv"
      lat_longs: "../country_lat_longs.tsv"
      output_selection:
        - "nwk"
        - "nexus"
        - "auspice"
        - "node-data"
        - "model"
        - "traits"
