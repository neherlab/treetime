# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-mugration.schema.json

# Ancestral sampling country (zika/86).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime mugration --config data/zika/86/mugration-country.yaml --output-all tmp/examples/zika/86/mugration-country
#
# Discrete-trait reconstruction of the sampling country, 18 states, without the
# prior weights of `data/zika/20/mugration-country-weights.yaml`.

tree: "tree.nwk"
metadata: "metadata.tsv"
attribute: "country"
