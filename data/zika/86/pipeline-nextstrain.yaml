# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-pipeline.schema.json

# Nextstrain zika build, TreeTime part (zika/86).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime pipeline --config data/zika/86/pipeline-nextstrain.yaml --output-all tmp/examples/zika/86/pipeline-nextstrain
#
# nextstrain/zika@12de10f: `augur refine --timetree --coalescent opt
# --date-inference marginal --date-confidence --clock-filter-iqd 4`,
# `augur ancestral --inference joint`, `augur traits --columns region country
# --confidence --branch-labels region --sampling-bias-correction 3`
# (phylogenetic/defaults/config.yaml lines 27-42). This example uses the bundled
# 2013-2016 samples. The country step adds coordinates from
# `../country_lat_longs.tsv` so Auspice can show the countries on a map.
#
# augur refine removes the tips that its clock filter flags, and the tips without a
# usable date. `prune_filtered_tips` and `prune_undated_tips` enable that removal
# in TreeTime v1. The two programs can flag different tips because Augur filters
# on the input branch lengths, before the time-tree run.
#
# TreeTime v1 reports date intervals with `confidence`; its date assignment differs
# from Augur's marginal date assignment. The ancestral step uses marginal nucleotide
# reconstruction with imputed tips in place of joint reconstruction. This example
# omits protein translation and region branch labels. `no_indels` omits the indel term
# from branch lengths, as in TreeTime 0.x. `seed` makes TreeTime's stochastic
# polytomy resolution reproducible.

steps:
  - name: "timetree"
    timetree:
      tree: "tree.nwk"
      metadata: "metadata.tsv"
      alignment:
        - "aln.fasta.xz"
      coalescent: "opt"
      confidence: true
      clock_filter: 4.0
      prune_filtered_tips: true
      prune_undated_tips: true
      no_indels: true
      seed: 42

  - name: "ancestral"
    ancestral:
      tree: "{{ steps.timetree.outputs.nwk }}"
      alignment:
        - "aln.fasta.xz"
      method_anc: "marginal"
      impute_missing_data: true

  - name: "mugration-region"
    mugration:
      tree: "{{ steps.timetree.outputs.nwk }}"
      metadata: "metadata.tsv"
      attribute: "region"
      confidence: true
      sampling_bias_correction: 3.0

  - name: "mugration-country"
    mugration:
      tree: "{{ steps.timetree.outputs.nwk }}"
      metadata: "metadata.tsv"
      attribute: "country"
      confidence: true
      sampling_bias_correction: 3.0
      lat_longs: "../country_lat_longs.tsv"
      output_selection:
        - "nwk"
        - "auspice"
        - "node-data"
        - "model"
        - "traits"
