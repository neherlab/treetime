# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-pipeline.schema.json

# Nextstrain zika build, TreeTime part (zika/86).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime pipeline --config data/zika/86/pipeline-nextstrain.yaml --output-all tmp/examples/zika/86/pipeline-nextstrain
#
# nextstrain/zika@12de10f: `augur refine --timetree --coalescent opt --date-confidence
# --clock-filter-iqd 4`, `augur ancestral --inference joint`, `augur traits --columns
# region country --confidence --sampling-bias-correction 3`. The country step also
# writes the coordinates of each country (`../country_lat_longs.tsv`), so Auspice
# shows the countries on a map.
#
# Each setting of the build maps to a TreeTime v1 option: the joint reconstruction of
# augur becomes marginal with imputed tips, `no_indels` leaves indels out of the
# branch lengths as TreeTime 0.x does, `clock_filter` takes the value of the build
# (TreeTime filters at 4 by default), and `seed` fixes the random order of the
# polytomy resolution where the run resolves polytomies.

steps:
  - name: "timetree"
    timetree:
      tree: "tree.nwk"
      metadata: "metadata.tsv"
      alignment:
        - "aln.fasta.xz"
      coalescent: "opt"
      confidence: true
      clock_filter: 4.0
      no_indels: true
      seed: 42

  - name: "ancestral"
    ancestral:
      tree: "{{ steps.timetree.outputs.nwk }}"
      alignment:
        - "aln.fasta.xz"
      method_anc: "marginal"
      impute_missing_data: true

  - name: "mugration-region"
    mugration:
      tree: "{{ steps.timetree.outputs.nwk }}"
      metadata: "metadata.tsv"
      attribute: "region"
      confidence: true
      sampling_bias_correction: 3.0

  - name: "mugration-country"
    mugration:
      tree: "{{ steps.timetree.outputs.nwk }}"
      metadata: "metadata.tsv"
      attribute: "country"
      confidence: true
      sampling_bias_correction: 3.0
      lat_longs: "../country_lat_longs.tsv"
      output_selection:
        - "nwk"
        - "auspice"
        - "node-data"
        - "model"
        - "traits"
