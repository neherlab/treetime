# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-ancestral.schema.json

# Ancestral sequences of four influenza segments by Fitch parsimony on a graph of segment trees (flu/h3n2/segments/1564).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime ancestral --config data/flu/h3n2/segments/1564/ancestral-parsimony.yaml --output-all tmp/examples/flu/h3n2/segments/1564/ancestral-parsimony
#
# The HA, NA, PB1 and PB2 trees of these viruses differ where the segments
# reassorted. TreeTime merges them into one graph by node name: an ancestor that
# several segments share has one name in every tree (../README.md).
#
# Each segment's sequences pass only along the edges of its own tree in the merged
# graph. The merge can insert nodes that a segment passes through and regroup the
# children of a node under them, so the reconstruction runs on each segment's tree
# after the merge. On these datasets it equals a run on the input tree alone at
# every node of that tree; this is a measurement on these trees, not a property of
# every merge.

segment_trees:
  - "tree_ha.nwk"
  - "tree_na.nwk"
  - "tree_pb1.nwk"
  - "tree_pb2.nwk"
segment_alignments:
  - "aln_ha.fasta.xz"
  - "aln_na.fasta.xz"
  - "aln_pb1.fasta.xz"
  - "aln_pb2.fasta.xz"

# Fitch parsimony: fast, model-free ancestral states and mutations.
method_anc: "parsimony"
