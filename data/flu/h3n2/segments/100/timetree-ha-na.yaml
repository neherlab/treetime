# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-timetree.schema.json

# Dated graph of the HA and NA trees, the segments of the public Nextstrain H3N2 builds (flu/h3n2/segments/100).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime timetree --config data/flu/h3n2/segments/100/timetree-ha-na.yaml --output-all tmp/examples/flu/h3n2/segments/100/timetree-ha-na
#
# The HA, NA, PB1 and PB2 trees of these viruses differ where the segments
# reassorted. TreeTime merges them into one graph by node name: an ancestor that
# several segments share has one name in every tree (../README.md).
#
# Two of the four trees form a graph of their own: the names stay valid for any
# subset of the segments. Compare the dates with `timetree-confidence.yaml`, which
# adds the polymerase segments PB1 and PB2.

segment_trees:
  - "tree_ha.nwk"
  - "tree_na.nwk"
segment_alignments:
  - "aln_ha.fasta.xz"
  - "aln_na.fasta.xz"
metadata: "metadata.tsv"

# Clock rate in substitutions per site per year, averaged over the sites of HA and
# NA: the mean of the Nextstrain H3N2 rates of the two segments
# (nextstrain/seasonal-flu@9ec17de, workflow/snakemake_rules/core.smk:198-199: HA
# 0.00382, NA 0.00267), weighted by the alignment widths 1737 and 1436:
# 10.469 / 3173 = 0.0033.
clock_rate: 0.0033

# 90% date intervals of every node, in the node dates table.
confidence: true
