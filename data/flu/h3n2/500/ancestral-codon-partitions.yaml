# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-ancestral.schema.json

# Ancestral sequences with one substitution model per codon position (flu/h3n2/500).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime ancestral --config data/flu/h3n2/500/ancestral-codon-partitions.yaml --output-all tmp/examples/flu/h3n2/500/ancestral-codon-partitions
#
# The partitions of `data/flu/h3n2/500/optimize-codon-partitions.yaml`: each codon
# position of the NA coding sequence has its own GTR model, fitted from the
# reconstruction.

tree: "tree.nwk"
alignment:
  - "aln.fasta.xz"

partition:
  - name: "codon-1"
    sites: ['1-1407\3']
  - name: "codon-2"
    sites: ['2-1407\3']
  - name: "codon-3"
    sites: ['3-1407\3']
