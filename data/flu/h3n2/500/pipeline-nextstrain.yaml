# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-pipeline.schema.json

# Nextstrain seasonal-flu h3n2 NA build, TreeTime part (flu/h3n2/500).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime pipeline --config data/flu/h3n2/500/pipeline-nextstrain.yaml --output-all tmp/examples/flu/h3n2/500/pipeline-nextstrain
#
# nextstrain/seasonal-flu@2668477, segment na:
# `workflow/snakemake_rules/core.smk:127-140` roots the tree on the reference
# A/Wisconsin/67/2005 and prunes it. Lines 189-271 set the clock rates and run
# `augur refine --keep-root --stochastic-resolve --timetree --use-fft
# --no-covariance --clock-rate 0.00267 --clock-std-dev 0.000534 --coalescent const
# --date-confidence --date-inference marginal --clock-filter-iqd 4`; `augur ancestral
# --inference joint --root-sequence <reference> --genes NA --translations ...`;
# `augur traits --columns region --confidence` (lines 309-336) uses no sampling
# bias correction. The rate comes from the h3n2 NA 12-year builds; its standard
# deviation is one fifth of the rate.
#
# Each setting of the build maps to a TreeTime v1 option: the joint reconstruction of
# augur becomes marginal with imputed tips, `no_indels` leaves indels out of the
# branch lengths as TreeTime 0.x does, `clock_filter` takes the value of the build
# (TreeTime filters at 4 by default), `prune_filtered_tips` and `prune_undated_tips`
# remove the tips that the clock filter flags and the tips without a date as `augur
# refine` does, and `seed` fixes the random order of the polytomy resolution, which is
# stochastic in TreeTime v1 as with `--stochastic-resolve`. `coalescent: opt` is
# `--coalescent const`, which TreeTime 0.x also optimizes. v1 has no clock covariance
# (`--no-covariance`) and no FFT switch, no counterpart of the outlier script
# `scripts/flag_outliers.py` that the build runs before `augur refine`, and no
# nucleotide root sequence; the amino-acid reconstruction of NA needs the
# translations, which this dataset does not have.
#
# This dataset includes samples collected decades before the workflow's reference.
# The pipeline roots on A/Hong_Kong/1/68, one of the earliest samples, and removes
# A/Wisconsin/67/2005 as the workflow does. The clock filter removes 13 tips on this
# dataset, including 11 from 1968 to 1976. TreeTime v1 filters with the fixed rate.
# Augur filters with a fitted rate and can keep a different set of tips
# (`kb/issues/M-clock-filter-kept-tips-differ-from-augur-refine-which-filters-without-the-clock-rate.md`).

vars:
  root: "A/Hong_Kong/1/68|AF348187|1968|Hong_Kong||H3N2/19-1427"
  reference: "A/Wisconsin/67/2005|EF541463|08/21/2005|USA||H3N2/1-1409"

steps:
  - name: "optimize"
    optimize:
      tree: "tree.nwk"
      alignment:
        - "aln.fasta.xz"
      outgroup:
        - "{{ vars.root }}"
      no_indels: true

  - name: "prune"
    prune:
      tree: "{{ steps.optimize.outputs.nwk }}"
      alignment:
        - "aln.fasta.xz"
      remove:
        - "{{ vars.reference }}"

  - name: "timetree"
    timetree:
      tree: "{{ steps.prune.outputs.nwk }}"
      metadata: "metadata.tsv"
      alignment:
        - "aln.fasta.xz"
      keep_root: true
      clock_rate: 0.00267
      clock_std_dev: 0.000534
      coalescent: "opt"
      confidence: true
      clock_filter: 4.0
      prune_filtered_tips: true
      prune_undated_tips: true
      no_indels: true
      seed: 42

  - name: "ancestral"
    ancestral:
      tree: "{{ steps.timetree.outputs.nwk }}"
      alignment:
        - "aln.fasta.xz"
      method_anc: "marginal"
      impute_missing_data: true

  - name: "mugration-region"
    mugration:
      tree: "{{ steps.timetree.outputs.nwk }}"
      metadata: "metadata.tsv"
      attribute: "region"
      confidence: true
