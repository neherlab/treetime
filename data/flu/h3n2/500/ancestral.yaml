# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-ancestral.schema.json

# Ancestral sequences with the default settings (flu/h3n2/500).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime ancestral --config data/flu/h3n2/500/ancestral.yaml --output-all tmp/examples/flu/h3n2/500/ancestral
#
# Marginal reconstruction of 476 H3N2 neuraminidase sequences: the run fits a GTR
# model from the data, gives every node the most likely state at every site, and maps
# the mutations onto the branches. The default sparse representation keeps only the
# variable sites.

tree: "tree.nwk"
alignment:
  - "aln.fasta.xz"
