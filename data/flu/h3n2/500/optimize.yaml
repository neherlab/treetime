# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-optimize.schema.json

# Branch-length optimization with the default settings (flu/h3n2/500).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime optimize --config data/flu/h3n2/500/optimize.yaml --output-all tmp/examples/flu/h3n2/500/optimize
#
# `optimize` re-estimates every branch length of 476 H3N2 neuraminidase sequences
# under an inferred GTR model and keeps the root of the input tree.

tree: "tree.nwk"
alignment:
  - "aln.fasta.xz"
