# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-timetree.schema.json

# Influenza H3N2 time tree with an estimated clock and a skyline coalescent (flu/h3n2/500).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime timetree --config data/flu/h3n2/500/timetree-skyline-confidence.yaml --output-all tmp/examples/flu/h3n2/500/timetree-skyline-confidence
#
# `data/flu/h3n2/500/pipeline-nextstrain.yaml` fixes the clock rate; this file
# estimates it from 476 neuraminidase sequences instead. The skyline coalescent
# (`coalescent: skyline`) fits a piecewise-linear history of the coalescent time scale
# Tc. `confidence` runs a final marginal round of the time inference and writes the
# 90% interval of every node date, including the uncertainty of the estimated rate.
# `seed` makes the random order of the polytomy resolution reproducible.

tree: "tree.nwk"
metadata: "metadata.tsv"
alignment:
  - "aln.fasta.xz"

coalescent: "skyline"
confidence: true
max_iter: 3
seed: 42
