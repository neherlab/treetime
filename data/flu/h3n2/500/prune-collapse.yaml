# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-prune.schema.json

# Tree cleanup: short, empty, and shared-mutation branches (flu/h3n2/500).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime prune --config data/flu/h3n2/500/prune-collapse.yaml --output-all tmp/examples/flu/h3n2/500/prune-collapse
#
# `prune` removes artifacts of the tree builder before a downstream analysis:
# branches shorter than a threshold, branches without a mutation, and sibling
# branches of a polytomy that share mutations, which move under one new edge.

tree: "tree.nwk"
alignment:
  - "aln.fasta.xz"

collapse_short: 1.0e-6
collapse_empty: true
merge_shared_mutations: true
