# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-pipeline.schema.json

# Nextstrain lassa L segment build, TreeTime part (lassa/L/500).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime pipeline --config data/lassa/L/500/pipeline-nextstrain.yaml --output-all tmp/examples/lassa/L/500/pipeline-nextstrain
#
# nextstrain/lassa@8bd66e3, segment l: `augur refine --timetree --coalescent opt
# --date-inference marginal --date-confidence --root mid_point --clock-rate 0.00078`
# (no clock filter), then
# `augur ancestral --inference joint`, `augur traits --columns country --confidence`.
# The workflow config takes the clock rate from Ehichioya et al. 2019, "Phylogeography
# of Lassa virus in Nigeria", J Virol 93:e00929-19, doi:10.1128/JVI.00929-19
# (phylogenetic/defaults/config.yaml lines 33-47). `reroot: midpoint` roots the
# tree at the middle of its longest tip-to-tip path. The workflow uses the same
# settings for S, but fits each segment on its own tree and alignment.
#
# TreeTime v1 reports date intervals with `confidence`; its date assignment differs
# from Augur's marginal date assignment. The ancestral step uses marginal nucleotide
# reconstruction with imputed tips in place of joint reconstruction and does not
# reconstruct proteins. `clock_filter: 0.0` disables TreeTime's default filter.
# `no_indels` omits the indel term from branch lengths, as in TreeTime 0.x.
# `seed` makes TreeTime's stochastic polytomy resolution reproducible.

vars:
  metadata_id_columns:
    - "accession"

steps:
  - name: "timetree"
    timetree:
      tree: "tree.nwk"
      metadata: "metadata.tsv"
      metadata_id_columns: "{{ vars.metadata_id_columns }}"
      alignment:
        - "aln.fasta.xz"
      reroot: "midpoint"
      clock_rate: 0.00078
      coalescent: "opt"
      confidence: true
      clock_filter: 0.0
      no_indels: true
      seed: 42

  - name: "ancestral"
    ancestral:
      tree: "{{ steps.timetree.outputs.nwk }}"
      alignment:
        - "aln.fasta.xz"
      method_anc: "marginal"
      impute_missing_data: true

  - name: "mugration-country"
    mugration:
      tree: "{{ steps.timetree.outputs.nwk }}"
      metadata: "metadata.tsv"
      metadata_id_columns: "{{ vars.metadata_id_columns }}"
      attribute: "country"
      confidence: true
