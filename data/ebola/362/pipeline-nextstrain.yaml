# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-pipeline.schema.json

# Nextstrain ebola west-africa-2014 build, TreeTime part (ebola/362).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime pipeline --config data/ebola/362/pipeline-nextstrain.yaml --output-all tmp/examples/ebola/362/pipeline-nextstrain
#
# nextstrain/ebola@cc08e16, build ebov/west-africa-2014:
# `augur refine --timetree --date-inference marginal --coalescent skyline
# --date-confidence` (no clock filter), `augur ancestral` (joint by default),
# and `augur traits --columns country division --confidence`
# (phylogenetic/defaults/config.yaml lines 118-125, 157-164 and 186-189).
# This example uses the bundled outbreak samples and the same alignment for
# dating and nucleotide reconstruction. The workflow uses its masked alignment
# for dating and its unmasked alignment for ancestral reconstruction.
#
# TreeTime v1 reports date intervals with `confidence`; its date assignment differs
# from Augur's marginal date assignment. The ancestral step uses marginal nucleotide
# reconstruction with imputed tips in place of joint reconstruction and does not
# reconstruct proteins. `clock_filter: 0.0` disables TreeTime's default filter.
# `no_indels` omits the indel term from branch lengths, as in TreeTime 0.x.
# `seed` makes TreeTime's stochastic polytomy resolution reproducible.

steps:
  - name: "timetree"
    timetree:
      tree: "tree.nwk"
      metadata: "metadata.tsv"
      alignment:
        - "aln.fasta.xz"
      coalescent: "skyline"
      confidence: true
      clock_filter: 0.0
      no_indels: true
      seed: 42

  - name: "ancestral"
    ancestral:
      tree: "{{ steps.timetree.outputs.nwk }}"
      alignment:
        - "aln.fasta.xz"
      method_anc: "marginal"
      impute_missing_data: true

  - name: "mugration-country"
    mugration:
      tree: "{{ steps.timetree.outputs.nwk }}"
      metadata: "metadata.tsv"
      attribute: "country"
      confidence: true

  - name: "mugration-division"
    mugration:
      tree: "{{ steps.timetree.outputs.nwk }}"
      metadata: "metadata.tsv"
      attribute: "division"
      confidence: true
