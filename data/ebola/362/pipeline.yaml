# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-pipeline.schema.json

# Full three-step build on a real epidemic dataset (ebola/362).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime pipeline --config data/ebola/362/pipeline.yaml --output-all tmp/examples/ebola/362/pipeline
#
# Preview the plan, or resume from a step after a failure:
#   treetime pipeline --config data/ebola/362/pipeline.yaml --check --output-all tmp/examples/ebola/362/pipeline
#   treetime pipeline --config data/ebola/362/pipeline.yaml --steps ancestral,timetree --output-all tmp/examples/ebola/362/pipeline
#
# optimize -> ancestral -> timetree, chained end to end. Each step consumes the
# previous step's tree through `{{ steps.<name>.outputs.nwk }}`. The final
# timetree fits a constant coalescent time scale analytically (`coalescent_opt`)
# and writes an Auspice JSON ready for nextstrain.org.

steps:
  # 1. Optimize branch lengths and reroot on the min-divergence branch.
  - name: "optimize"
    optimize:
      tree: "tree.nwk"
      alignment:
        - "aln.fasta.xz"
      reroot: "min-dev"

  # 2. Reconstruct ancestral sequences and mutations on the optimized tree.
  - name: "ancestral"
    ancestral:
      tree: "{{ steps.optimize.outputs.nwk }}"
      alignment:
        - "aln.fasta.xz"
      method_anc: "marginal"

  # 3. Date the optimized tree, keeping the branch lengths from step 1.
  - name: "timetree"
    timetree:
      tree: "{{ steps.optimize.outputs.nwk }}"
      metadata: "metadata.tsv"
      alignment:
        - "aln.fasta.xz"
      coalescent_opt: true
      max_iter: 3
