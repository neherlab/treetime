# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-optimize.schema.json

# Branch-length optimization with the default settings (ebola/362).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime optimize --config data/ebola/362/optimize.yaml --output-all tmp/examples/ebola/362/optimize
#
# `optimize` re-estimates every branch length of 362 Ebola virus genomes of the
# 2014-2016 epidemic under an inferred GTR model and keeps the root of the input tree.

tree: "tree.nwk"
alignment:
  - "aln.fasta.xz"
