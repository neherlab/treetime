# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-prune.schema.json

# Remove named tips from the tree (ebola/20).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime prune --config data/ebola/20/prune-remove.yaml --output-all tmp/examples/ebola/20/prune-remove
#
# `prune-nodes.txt` lists one node name per line, here two tips. The run removes these
# nodes from the tree.

tree: "tree.nwk"
alignment:
  - "aln.fasta.xz"

remove_file: "prune-nodes.txt"
