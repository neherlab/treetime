# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-timetree.schema.json

# Time tree from the input branch lengths, without sequences (sc2/5100).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime timetree --config data/sc2/5100/timetree-input-branch-lengths.yaml --output-all tmp/examples/sc2/5100/timetree-input-branch-lengths
#
# `branch_length_mode: input` keeps the branch lengths of the input tree and skips the
# ancestral reconstruction of every round, the fastest way to date a large tree.
# `sequence_length` turns the substitutions per site of the tree into the mutation
# counts of the branch length likelihood.

tree: "tree.nwk"
metadata: "metadata.tsv.xz"

branch_length_mode: "input"
sequence_length: 29903
coalescent: "opt"
seed: 42
