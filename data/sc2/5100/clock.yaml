# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-clock.schema.json

# Root-to-tip regression with the default settings (sc2/5100).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime clock --config data/sc2/5100/clock.yaml --output-all tmp/examples/sc2/5100/clock
#
# `clock` reroots the tree to maximize the temporal signal of 5100 SARS-CoV-2 genomes,
# fits the regression of root-to-tip divergence on the sampling dates, and marks the
# tips that do not follow the clock.

tree: "tree.nwk"
metadata: "metadata.tsv.xz"
