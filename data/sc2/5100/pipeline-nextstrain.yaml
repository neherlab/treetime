# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-pipeline.schema.json

# Nextstrain ncov global build, TreeTime part (sc2/5100).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime pipeline --config data/sc2/5100/pipeline-nextstrain.yaml --output-all tmp/examples/sc2/5100/pipeline-nextstrain
#
# nextstrain/ncov@8e16d94: `augur refine --root Wuhan-Hu-1/2019 --timetree
# --stochastic-resolve --clock-rate 0.0008 --clock-std-dev 0.0004 --coalescent opt
# --divergence-unit mutations --date-confidence --clock-filter-iqd 8`, `augur ancestral
# --inference joint --infer-ambiguous`, `augur traits --columns region
# --sampling-bias-correction 2.5` (global builds; regional builds use `country`).
#
# Each setting of the build maps to a TreeTime v1 option: the joint reconstruction of
# augur becomes marginal with imputed tips, `no_indels` leaves indels out of the
# branch lengths as TreeTime 0.x does, `clock_filter` takes the value of the build
# (TreeTime filters at 4 by default), and `seed` fixes the random order of the
# polytomy resolution where the run resolves polytomies.

steps:
  - name: "timetree"
    timetree:
      tree: "tree.nwk"
      metadata: "metadata.tsv.xz"
      alignment:
        - "aln.fasta.xz"
      outgroup:
        - "Wuhan-Hu-1/2019"
      clock_rate: 0.0008
      clock_std_dev: 0.0004
      coalescent: "opt"
      confidence: true
      divergence_units: "mutations"
      clock_filter: 8.0
      no_indels: true
      seed: 42

  - name: "ancestral"
    ancestral:
      tree: "{{ steps.timetree.outputs.nwk }}"
      alignment:
        - "aln.fasta.xz"
      method_anc: "marginal"
      impute_missing_data: true

  - name: "mugration-region"
    mugration:
      tree: "{{ steps.timetree.outputs.nwk }}"
      metadata: "metadata.tsv.xz"
      attribute: "region"
      confidence: true
      sampling_bias_correction: 2.5
