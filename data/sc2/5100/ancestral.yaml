# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-ancestral.schema.json

# Ancestral sequences with the default settings (sc2/5100).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime ancestral --config data/sc2/5100/ancestral.yaml --output-all tmp/examples/sc2/5100/ancestral
#
# Marginal reconstruction of 5100 SARS-CoV-2 genomes: the run fits a GTR model from
# the data, gives every node the most likely state at every site, and maps the
# mutations onto the branches. The default sparse representation keeps only the
# variable sites.

tree: "tree.nwk"
alignment:
  - "aln.fasta.xz"
