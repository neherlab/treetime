# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-pipeline.schema.json

# Nextstrain RSV-A genome build, TreeTime part (rsv/a/2000).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime pipeline --config data/rsv/a/2000/pipeline-nextstrain.yaml --output-all tmp/examples/rsv/a/2000/pipeline-nextstrain
#
# nextstrain/rsv@7d91d8f, build a/genome (`config/configfile.yaml` L571-L584,
# `workflow/snakemake_rules/core.smk` L479-L492, L590-L599, L682-L688): `augur refine
# --timetree --coalescent opt --date-inference marginal --stochastic-resolve
# --clock-filter-iqd 4 --divergence-units mutations-per-site` (estimated clock rate, no
# date confidence), `augur ancestral --inference joint --annotation <reference>
# --root-sequence <reference> --genes F`, `augur traits --columns country region
# --confidence`. RSV-A and RSV-B use the same refine rule for genome, G and F,
# with a clock rate estimated separately for each tree. The gene builds use a
# gene-specific alignment and tree.
#
# Each setting of the build maps to a TreeTime v1 option: the joint reconstruction of
# augur becomes marginal with imputed tips, `no_indels` leaves indels out of the
# branch lengths as TreeTime 0.x does, and `seed` fixes the random order of the
# stochastic polytomy resolution. With `--clock-filter-iqd 4`, Augur removes
# flagged and undated tips (augur@58f32904, `augur/refine.py` L52-L62).
# TreeTime keeps both by default; `prune_filtered_tips` and `prune_undated_tips`
# enable both types of pruning before the downstream steps.
# At that Augur revision, the dating step uses joint dates when date confidence is
# off (`augur/refine.py` L64-L69). TreeTime v1 uses marginal dates.
# `--root-sequence` has no counterpart: TreeTime reports no mutations of the root
# against the reference.

vars:
  metadata_id_columns:
    - "accession"

steps:
  - name: "timetree"
    timetree:
      tree: "tree.nwk"
      metadata: "metadata.tsv"
      metadata_id_columns: "{{ vars.metadata_id_columns }}"
      alignment:
        - "aln.fasta.xz"
      coalescent: "opt"
      clock_filter: 4.0
      prune_filtered_tips: true
      prune_undated_tips: true
      no_indels: true
      seed: 42

  - name: "ancestral"
    ancestral:
      tree: "{{ steps.timetree.outputs.nwk }}"
      alignment:
        - "aln.fasta.xz"
      method_anc: "marginal"
      impute_missing_data: true
      annotation:
        - "annotation.gff3"
      translations: "translations/{cds}.fasta.xz"
      cds_selection:
        - "F"

  - name: "mugration-country"
    mugration:
      tree: "{{ steps.timetree.outputs.nwk }}"
      metadata: "metadata.tsv"
      metadata_id_columns: "{{ vars.metadata_id_columns }}"
      attribute: "country"
      confidence: true

  - name: "mugration-region"
    mugration:
      tree: "{{ steps.timetree.outputs.nwk }}"
      metadata: "metadata.tsv"
      metadata_id_columns: "{{ vars.metadata_id_columns }}"
      attribute: "region"
      confidence: true
