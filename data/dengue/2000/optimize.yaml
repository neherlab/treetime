# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-optimize.schema.json

# Branch-length optimization with the default settings (dengue/2000).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime optimize --config data/dengue/2000/optimize.yaml --output-all tmp/examples/dengue/2000/optimize
#
# `optimize` re-estimates every branch length of 1954 DENV2 genomes under an inferred
# GTR model and keeps the root of the input tree.

tree: "tree.nwk"
alignment:
  - "aln.fasta.xz"
