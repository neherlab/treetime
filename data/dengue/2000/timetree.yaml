# yaml-language-server: $schema=https://raw.githubusercontent.com/neherlab/treetime/rust/packages/schemas/input-config-timetree.schema.json

# Time tree with the default settings (dengue/2000).
#
# Run from any folder; relative paths in this file resolve from its folder, and
# `--output-all` chooses the output folder. From the repository root:
#   treetime timetree --config data/dengue/2000/timetree.yaml --output-all tmp/examples/dengue/2000/timetree
#
# `timetree` estimates the clock rate of 1954 DENV2 genomes, reroots the tree, and dates
# every node. `seed` makes the random order of the polytomy resolution
# reproducible.

tree: "tree.nwk"
metadata: "metadata.tsv"
metadata_id_columns:
  - "genbank_accession"
alignment:
  - "aln.fasta.xz"

seed: 42
