# Developer tool versions for TreeTime, pinned and checksummed in mise.lock.
# The same file drives local machines and the build container (see
# dev/docker/native.dockerfile), so every environment resolves identical tools.
# Regenerate the lock after editing versions with: just tools-lock

[settings]
# Record an exact version, URL, size, and checksum for every tool in mise.lock
# and refuse to install anything the lock does not cover.
lockfile = true
pin = true

[tools]
just = "1.42.4"
node = "24.16.0"
bun = "1.3.14"
shellcheck = "0.11.0"
shfmt = "3.12.0"
jq = "1.7.1"
yq = "4.48.1"
watchexec = "2.3.2"
mold = "2.40.4"
ripgrep = "14.1.1"
taplo = "0.10.0"
hadolint = "2.14.0"
cargo-deny = "0.20.2"
"github:astral-sh/hawk" = { version = "0.1.14", exe = "cargo-hawk" }
# kache is the RUSTC_WRAPPER compiler cache the build, clippy, and dylint stores
# share; the musl release is statically linked and runs on the Debian base image.
"github:kunobi-ninja/kache" = { version = "0.13.0", asset_pattern = "kache-x86_64-unknown-linux-musl.tar.gz" }
# cargo-llvm-cov backs the coverage report; the musl release runs on the base image.
"github:taiki-e/cargo-llvm-cov" = { version = "0.9.1", asset_pattern = "cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz" }

# nextest ships per-crate tags (cargo-nextest-<ver>), so the version is the full
# tag. cargo-edit and the dylint binaries have no usable prebuilt for this glibc,
# so they build from source via the cargo backend (the lock records versions,
# not download checksums). The pinned nightly dylint driver toolchain stays in
# dev/docker/files/install-dylint, since mise does not manage rustup toolchains.
"ubi:nextest-rs/nextest" = { version = "cargo-nextest-0.9.67", exe = "cargo-nextest" }
"cargo:cargo-edit" = "0.13.7"
# cargo-mutants (mutation testing) builds from source via the cargo backend.
"cargo:cargo-mutants" = "27.1.0"
# jscpd (copy-paste detection) via the cargo backend. jscpd also ships an npm
# package, but the npm backend's supply-chain trust policy blocks it; the
# crates.io release is the same Rust CLI and installs cleanly.
"cargo:jscpd" = "5.2.0"
"cargo:cargo-dylint" = "6.0.3"
"cargo:dylint-link" = "6.0.3"
