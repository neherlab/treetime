# Normalize the build path so every checkout and worktree produces identical
# kache cache keys.
[env]
KACHE_BASE_DIR = { value = ".", relative = true, force = true }

# The same flags for every native build, test, lint, and addon build, so these
# never invalidate each other's artifacts:
# - mold links fast; the link runs on every edit and is never cached
# - frame pointers and v0 symbol mangling give profilers and backtraces full
#   stacks and generic paths
# - the static OpenBLAS archive needs libgfortran and pthreads, which the
#   openblas-src build script does not declare; both link statically, so the
#   binaries and the Node addon do not depend on the compiler runtime
# Release cross builds set their own flags in dev/cross/build.
[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-Clink-arg=-fuse-ld=mold",
  "-Cforce-frame-pointers=yes",
  "-Csymbol-mangling-version=v0",
  "-Clink-arg=-pthread",
  "-Clink-arg=-lopenblas",
  "-Clink-arg=-lgfortran",
  "-Clink-arg=-static-libgfortran",
  "-Clink-arg=-static-libgcc",
]

[future-incompat-report]
frequency = "always"
