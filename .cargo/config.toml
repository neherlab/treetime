# Settings of the kache compiler cache, which cargo passes to the rustc wrapper.
# `force` overrides the environment, so every checkout and worktree compiles
# with the same settings.
# - KACHE_BASE_DIR normalizes the build path, so every checkout and worktree
#   produces identical cache keys
# - KACHE_AUTO_CLEAN_ORPHANED_TARGETS turns off the removal of targets whose
#   workspace kache considers deleted: every target directory lives under
#   .build/ of its checkout and goes away with it, and kache records the
#   workspace of a target outside <workspace>/target as the working directory
#   of some compiled package, such as a registry source that cargo's own cache
#   cleanup may delete while the checkout is still in use
# - the other settings turn off kache's miss explanations, heartbeat, and
#   progress output
[env]
KACHE_AUTO_CLEAN_ORPHANED_TARGETS = { value = "0", force = true }
KACHE_BASE_DIR = { value = ".", relative = true, force = true }
KACHE_EXPLAIN_MISS = { value = "0", force = true }
KACHE_HEARTBEAT_SECS = { value = "0", force = true }
KACHE_PROGRESS = { value = "off", force = true }
# The CPU level of the shipped x86_64 builds (dev/lib/dist-flags.sh) for the C
# code of the development builds; without `force`, the flags that
# export_dist_flags exports win. dev/prebuilt-libs-check keeps both equal.
CFLAGS_x86_64_unknown_linux_gnu = "-march=x86-64-v2"
CXXFLAGS_x86_64_unknown_linux_gnu = "-march=x86-64-v2"

# The same flags for every native build, test, lint, and addon build, so these
# never invalidate each other's artifacts:
# - mold links fast; the link runs on every edit and is never cached
# - the CPU level of the shipped builds (dev/lib/dist-flags.sh), so tests run
#   the code that ships; dev/prebuilt-libs-check keeps both equal
# - frame pointers and v0 symbol mangling give profilers and backtraces full
#   stacks and generic paths
# The dist, profiling, and bench builds and the cross builds replace these
# flags with the flags of the shipped builds (dev/lib/dist-flags.sh).
[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-Clink-arg=-fuse-ld=mold",
  "-Ctarget-cpu=x86-64-v2",
  "-Cforce-frame-pointers=yes",
  "-Csymbol-mangling-version=v0",
]

# The WebAssembly back end of the web2 app. rustc links through emcc, and emcc
# runs wasm-bindgen on the linked module (`-sWASM_BINDGEN`), so the wasm-bindgen
# CLI on PATH must equal the wasm-bindgen pin. mise installs the binarylandia
# build of that CLI (task tasks/wasm-bindgen of binarylandia/appville), which
# patches upstream to keep the linker start function of threaded modules; a new
# pin needs a new appville release first:
# - panic=abort and no C++ exceptions, because wasm-bindgen does not support
#   unwinding on this target; a static relocation model, because the module is
#   one main module
# - an ES module whose default export creates an instance, for a dedicated
#   worker and for Node
# - memory that grows up to the 4 GiB of wasm32, and a stack of 8 MiB instead of
#   the 64 KiB default
# - --emit-tsd writes the TypeScript declarations of the exports next to the
#   module
# - a stack overflow stops the module with "stack overflow" instead of silently
#   overwriting data: the stack check stops on any overflow of the main stack
#   and of the thread stacks, and the stack placed before static data makes an
#   overflow that the check misses trap instead of overwriting static data
[target.wasm32-unknown-emscripten]
rustflags = [
  "-Cpanic=abort",
  "-Cllvm-args=-enable-emscripten-cxx-exceptions=0",
  "-Crelocation-model=static",
  "-Clink-arg=-sWASM_BINDGEN",
  "-Clink-arg=-Wno-experimental",
  "-Clink-arg=-sMODULARIZE",
  "-Clink-arg=-sEXPORT_ES6",
  "-Clink-arg=-sENVIRONMENT=worker,node",
  "-Clink-arg=-sALLOW_MEMORY_GROWTH",
  "-Clink-arg=-sMAXIMUM_MEMORY=4GB",
  "-Clink-arg=-sSTACK_SIZE=8MB",
  "-Clink-arg=--emit-tsd=app-wasm.d.ts",
  "-Clink-arg=-sSTACK_OVERFLOW_CHECK=2",
  "-Clink-arg=-Wl,--stack-first",
]
