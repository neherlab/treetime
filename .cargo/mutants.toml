# cargo-mutants configuration. See https://mutants.rs/config-file.html
#
# Tests run through cargo-nextest, matching the project's test runner. The
# `just mutants` and `just mutants-full` recipes drive it.
test_tool = "nextest"

# Timeouts are multiples of the measured baseline test and build runtime. The
# workspace test build is heavy, so keep a generous floor on the test timeout.
timeout_multiplier = 5.0
build_timeout_multiplier = 5.0
minimum_test_timeout = 300

# Mutation output goes under tmp/ so git ignores it.
output = "tmp/mutants"

# Exclusions are NOT declared here. They live in mutants-exclusions.toml beside
# this file, one entry per exclusion, each carrying a reason. The mutation
# recipes validate that file and derive the --exclude / --exclude-re flags from
# it, and reject any exclude_globs, exclude_re, examine_globs, or examine_re key
# placed here, so no exclusion can enter without a reason.
