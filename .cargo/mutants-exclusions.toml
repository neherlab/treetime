# Mutation-testing exclusions. Every entry MUST carry a non-empty reason.
#
# The `just mutants` and `just mutants-full` recipes validate this file before
# running cargo-mutants. An entry without a reason, or with neither a `file` nor
# a `name` key (or with both), is a hard error, so an exclusion can never be
# added silently. Each validated entry becomes a cargo-mutants flag:
#   file = "<glob>"   -> --exclude <glob>      (skip mutants in matching files)
#   name = "<regex>"  -> --exclude-re <regex>  (skip mutants whose name matches)
#
# There are no exclusions. Surviving mutants in existing code are reported by the
# recipes, not hidden here; addressing them is out of scope for this tooling
# setup.
#
# Example (uncomment and give a real reason to use):
# [[exclude]]
# name = "<impl Display for .*>::fmt"
# reason = "Display output is covered by snapshot tests, not by mutation testing"

exclude = []
