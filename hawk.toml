# cargo-hawk configuration -- finds unnecessary public surface in the workspace.
# https://github.com/astral-sh/hawk
#
# `[[production]]` names the reachability roots (the shipped binaries). Public
# items unreachable from a root are candidates for the `hawk::dead_public`
# diagnostic. `[[doctest]]` restricts the doctest reachability pass to the named
# packages. `[[exclude]]` silences diagnostics in generated code. `[[override]]`
# records a single item deliberately kept public despite being unreachable, each
# with a mandatory reason.

# Doctest reachability pass. Hawk runs `cargo test --doc` for the listed packages
# only; without this it compiles every package's doctests. `treetime-primitives`
# is the only package besides `treetime-utils` that carries doctests, and the
# `treetime-utils` `argmax_first` doctest does not compile (its empty `array![]`
# leaves the element type unconstrained), which would abort Hawk's instrumented
# build before it reports anything. The two `treetime-utils` doctests only call
# utilities already reachable from the product binaries, so scoping the pass to
# `treetime-primitives` costs no dead-public coverage.
[[doctest]]
package = "treetime-primitives"

# Shipped command-line binary; reachability root for the whole workspace.
[[production]]
package = "app-cli"
bin = "treetime"
reason = "the shipped treetime CLI is the primary product entry point"

# Shipped HTTP server binary; second reachability root.
[[production]]
package = "app-server"
bin = "treetime-server"
reason = "the shipped treetime-server binary is a product entry point"

# Prost-generated protobuf modules in util-usher-mat: machine-generated code
# whose public surface is dictated by the .proto schema, not by hand.
[[exclude]]
crate = "util_usher_mat"
module = "mutation_detailed"
reason = "prost-generated from the UShER protobuf schema"

[[exclude]]
crate = "util_usher_mat"
module = "parsimony"
reason = "prost-generated from the UShER protobuf schema"

[[exclude]]
crate = "util_usher_mat"
module = "taxodium"
reason = "prost-generated from the UShER protobuf schema"

# Record intentional exceptions here, one table per item, e.g.:
#
# [[override]]
# lint = "hawk::dead_public"
# crate = "treetime"
# item = "some::intentional::api"
# level = "expect"
# reason = "part of the stable library API consumed by an external crate"
