[package]
name = "app-api"
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
version.workspace = true

[lib]
doctest = false

[dependencies]
app-backend = { workspace = true }
app-commands = { workspace = true, features = ["clap"] }
treetime-schema = { workspace = true }
treetime-utils = { workspace = true }

aide = { workspace = true }
axum = { workspace = true }
ctor = { workspace = true }
deser = { workspace = true }
deser-json = { workspace = true }
deser-path = { workspace = true }
deser-serde = { workspace = true }
deser-urlencoded = { workspace = true }
deser-value = { workspace = true }
eyre = { workspace = true }
heck = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
mime = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = { workspace = true }
rayon = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
smart-default = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-stream = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

[dev-dependencies]
indoc = { workspace = true }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["io-util", "rt"] }
tower-http = { workspace = true, features = ["fs"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
treetime-charts = { workspace = true }

[lints]
workspace = true
