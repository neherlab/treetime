[package]
name = "app-api"
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
# [internal]
app-output = { workspace = true }
treetime = { workspace = true }
treetime-graph = { workspace = true }
treetime-io = { workspace = true }
treetime-primitives = { workspace = true }
treetime-utils = { workspace = true }
util-augur-node-data-json = { workspace = true }

# [external]
chrono = { workspace = true }
clap = { workspace = true, optional = true }
eyre = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
maplit = { workspace = true }
ndarray = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smart-default = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }

[features]
clap = ["dep:clap"]

[dev-dependencies]
# Self-reference enabling the `clap` feature for the test build only, so tests can exercise the
# `clap::ValueEnum` and `clap::Args` derives that production gates behind that feature. Previously
# this feature was pulled in transitively by `app-cli`; it now calls core directly and no longer
# depends on `app-api`, so `app-api` enables `clap` for its own tests here.
app-api = { path = ".", features = ["clap"] }
approx = { workspace = true }
ctor = { workspace = true }
indoc = { workspace = true }
jsonschema = { workspace = true }
pretty_assertions = { workspace = true }
rayon = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
treetime-distribution = { workspace = true }

[lints]
workspace = true
