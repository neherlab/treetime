[package]
name = "app-cli"
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
version.workspace = true

[lib]
doctest = false

# The float assertion macros of treetime-utils expand to `approx` calls in the tests.
[package.metadata.cargo-shear]
ignored = ["approx"]

[dependencies]
# [internal]
app-commands = { workspace = true, features = ["clap"] }
app-output = { workspace = true }
treetime = { workspace = true }
treetime-schema = { workspace = true, features = ["clap"] }
treetime-utils = { workspace = true }

# [external]
clap = { workspace = true }
clap-markdown = { workspace = true }
clap_complete = { workspace = true }
clap_complete_fig = { workspace = true }
comfy-table = { workspace = true }
crossterm = { workspace = true }
ctor = { workspace = true }
deser = { workspace = true }
deser-serde = { workspace = true }
deser-value = { workspace = true }
eyre = { workspace = true }
indicatif = { workspace = true }
indoc = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
maplit = { workspace = true }
minijinja = { workspace = true }
num-traits = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
rgb = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
strum = { workspace = true }
textplots = { workspace = true }

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tikv-jemallocator = { workspace = true }

[features]
"png" = ["app-commands/png"]
# Compile jemalloc with heap profiling and statistics, for `just build-profiling-heap`
"heap-profiling" = ["tikv-jemallocator/profiling", "tikv-jemallocator/stats"]

[dev-dependencies]
app-napi = { workspace = true }
app-server = { workspace = true }
approx = { workspace = true }
axum = { workspace = true }
napi = { workspace = true }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
