[package]
name = "app-cli"
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
version.workspace = true

[lib]
doctest = false

[dependencies]
# [internal]
app-output = { workspace = true }
treetime = { workspace = true }
treetime-graph = { workspace = true }
treetime-io = { workspace = true }
treetime-primitives = { workspace = true }
treetime-schema = { workspace = true, features = ["clap"] }
treetime-utils = { workspace = true }
util-augur-node-data-json = { workspace = true }

# [external]
clap = { workspace = true }
clap-markdown = { workspace = true }
clap_complete = { workspace = true }
clap_complete_fig = { workspace = true }
color-eyre = { workspace = true }
comfy-table = { workspace = true }
crossterm = { workspace = true }
ctor = { workspace = true }
derive_more = { workspace = true }
eyre = { workspace = true }
image = { workspace = true, optional = true }
indicatif = { workspace = true }
indoc = { workspace = true }
itertools = { workspace = true }
jsonschema = { workspace = true }
log = { workspace = true }
maplit = { workspace = true }
miette = { workspace = true }
minijinja = { workspace = true }
num-traits = { workspace = true }
parking_lot = { workspace = true }
plotters = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
rgb = { workspace = true }
saphyr = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
smart-default = { workspace = true }
strsim = { workspace = true }
strum_macros = { workspace = true }
textplots = { workspace = true }

[target.'cfg(all(target_arch = "x86_64", target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(all(target_arch = "aarch64", target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(all(target_arch = "x86_64", target_os = "linux", target_env = "musl"))'.dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(all(target_arch = "aarch64", target_os = "linux", target_env = "musl"))'.dependencies]
tikv-jemallocator = { workspace = true }

[features]
default = ["clap"]
# `clap` is a hard dependency of the CLI; this marker activates the `#[cfg(feature = "clap")]`
# argument derives in the command layer.
clap = []
"png" = ["image", "plotters/bitmap_backend", "plotters/ttf"]

[dev-dependencies]
approx = { workspace = true }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
