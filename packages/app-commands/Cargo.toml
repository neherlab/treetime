[features]
default = ["clap"]
# The `clap` derives on the command configs give the CLI its arguments, and give every client the
# CLI flag names in validation messages.
clap = ["dep:clap", "treetime-schema/clap"]
png = ["image", "plotters/bitmap_backend", "plotters/ttf"]

[dev-dependencies]
approx = { workspace = true }
axum = { workspace = true }
ctor = { workspace = true }
indoc = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
rayon = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
