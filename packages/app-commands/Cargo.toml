[package]
name = "app-commands"
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
version.workspace = true

[lib]
doctest = false

[package.metadata.cargo-shear]
ignored = ["approx"]

[dependencies]
app-output = { workspace = true }
treetime = { workspace = true }
treetime-graph = { workspace = true }
treetime-grid = { workspace = true }
treetime-io = { workspace = true }
treetime-primitives = { workspace = true }
treetime-schema = { workspace = true }
treetime-utils = { workspace = true }
util-augur-node-data-json = { workspace = true }

bon = { workspace = true }
clap = { workspace = true, optional = true }
color-eyre = { workspace = true }
derive_more = { workspace = true }
deser = { workspace = true }
deser-path = { workspace = true }
deser-serde = { workspace = true }
deser-value = { workspace = true }
deser-yaml = { workspace = true }
eyre = { workspace = true }
itertools = { workspace = true }
jsonschema = { workspace = true }
maplit = { workspace = true }
miette = { workspace = true }
ndarray = { workspace = true }
rand = { workspace = true }
saphyr = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
smart-default = { workspace = true }
strsim = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }

[features]
default = ["clap"]
# The `clap` derives on the command configs give the CLI its arguments, and give every client the
# CLI flag names in validation messages.
clap = ["dep:clap", "treetime-schema/clap"]

[dev-dependencies]
ab_glyph = { workspace = true }
approx = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio"] }
ctor = { workspace = true }
indoc = { workspace = true }
parking_lot = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
rayon = { workspace = true }
rstest = { workspace = true }
tiny-skia = { workspace = true }
tokio = { workspace = true, features = ["full"] }

# The HTTP client of the examples download of the local apps; reqwest has no
# blocking client on WebAssembly targets. The web app back end draws no charts:
# plotters measures text through the browser page on WebAssembly targets, which
# the web worker and Node do not have.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
plotters = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
treetime-charts = { workspace = true }

[lints]
workspace = true
