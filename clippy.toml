# Clippy configuration.
# https://doc.rust-lang.org/clippy/lint_configuration.html

# clippy::type_complexity
type-complexity-threshold = 500

# clippy::too_many_lines -- cap function bodies at 100 lines.
too-many-lines-threshold = 100

# Keep the panic-path restriction lints (unwrap_used, expect_used, panic,
# indexing_slicing) active in library code but exempt inside tests, where a
# panic is the correct failure mode for setup and assertions.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# clippy::disallowed_types -- steer type choices toward deterministic defaults.
# An unresolved path is silently ignored, so a ban can precede its first use.
disallowed-types = [
    { path = "std::sync::Mutex", reason = "use parking_lot::Mutex (poison-free, faster, supports lock_arc)" },
    { path = "std::sync::RwLock", reason = "use parking_lot::RwLock (poison-free, faster, supports read_arc/write_arc)" },
    { path = "std::collections::HashMap", reason = "use BTreeMap for deterministic order, or IndexMap for insertion order; #[expect(.., reason = '..')] in a profiled hot path" },
    { path = "std::collections::HashSet", reason = "use BTreeSet for deterministic order, or IndexSet for insertion order; #[expect(.., reason = '..')] in a profiled hot path" },
    { path = "rand::rngs::StdRng", reason = "use get_random_number_generator(seed) of treetime-utils so runs are reproducible", allow-invalid = true },
    { path = "rand::rngs::SmallRng", reason = "use get_random_number_generator(seed) of treetime-utils so runs are reproducible", allow-invalid = true },
    { path = "rand::rngs::SysRng", reason = "use get_random_number_generator(seed) of treetime-utils so runs are reproducible", allow-invalid = true },
]

# clippy::disallowed_methods -- forbid non-deterministic, panicking, or
# unbounded constructors in favor of their safe counterparts. Unresolved paths
# (e.g. for crates not yet depended on) are ignored until the crate is present.
disallowed-methods = [
    { path = "rand::rng", reason = "use get_random_number_generator(seed) of treetime-utils so runs are reproducible", allow-invalid = true },
    { path = "rand::make_rng", reason = "use get_random_number_generator(seed) of treetime-utils so runs are reproducible", allow-invalid = true },
    { path = "std::time::Duration::from_secs_f32", reason = "panics on a negative, NaN, or overflowing value; use Duration::try_from_secs_f32" },
    { path = "std::time::Duration::from_secs_f64", reason = "panics on a negative, NaN, or overflowing value; use Duration::try_from_secs_f64" },
    { path = "reqwest::Client::new", reason = "build the client through ClientBuilder with an explicit .timeout(...)", allow-invalid = true },
    { path = "std::sync::mpsc::channel", reason = "use a bounded channel (sync_channel or crossbeam bounded) to apply backpressure" },
    { path = "crossbeam_channel::unbounded", reason = "use crossbeam_channel::bounded to apply backpressure", allow-invalid = true },
    { path = "tokio::sync::mpsc::unbounded_channel", reason = "use tokio::sync::mpsc::channel with an explicit capacity", allow-invalid = true },
]

# clippy::disallowed_macros -- the assertions and comparisons of approx accept
# any two values closer than f64::EPSILON when the call gives no epsilon,
# whatever their magnitude, so a comparison with 0 or between tiny values passes
# without any check. The assertions of treetime-utils compare in units in the
# last place or relatively without that floor, unless the call gives an epsilon,
# and the absolute-difference assertion requires one. A comparison outside an
# assertion states its tolerance: a rule of its domain, such as the coordinate
# rule of treetime-grid, or the builders of approx with an explicit epsilon.
disallowed-macros = [
    { path = "approx::assert_abs_diff_eq", reason = "use pretty_assert_abs_diff_eq! of treetime-utils", allow-invalid = true },
    { path = "approx::assert_relative_eq", reason = "use pretty_assert_relative_eq! of treetime-utils", allow-invalid = true },
    { path = "approx::assert_ulps_eq", reason = "use pretty_assert_ulps_eq! of treetime-utils", allow-invalid = true },
    { path = "approx::abs_diff_eq", reason = "state the tolerance: approx::AbsDiff::default().epsilon(..)", allow-invalid = true },
    { path = "approx::abs_diff_ne", reason = "state the tolerance: approx::AbsDiff::default().epsilon(..)", allow-invalid = true },
    { path = "approx::relative_eq", reason = "state the tolerance: approx::Relative::default().epsilon(..)", allow-invalid = true },
    { path = "approx::relative_ne", reason = "state the tolerance: approx::Relative::default().epsilon(..)", allow-invalid = true },
    { path = "approx::ulps_eq", reason = "state the tolerance: approx::Ulps::default().epsilon(..), or a coordinate rule such as treetime_grid::coordinates_coincide", allow-invalid = true },
    { path = "approx::ulps_ne", reason = "state the tolerance: approx::Ulps::default().epsilon(..)", allow-invalid = true },
]
