# taplo TOML formatter configuration. See https://taplo.tamasfe.dev/configuration/

exclude = [
  "**/Cargo.lock",
  "mise.lock",
  ".build/**",
  ".cache/**",
  ".out/**",
  "target/**",
  "node_modules/**",
  ".repos/**",
  "tmp/**",
  "packages/legacy/**",
  "dev/dylint/**",
  "**/rust-toolchain.toml",
  "rustfmt.toml",
  "clippy.toml",
  "bunfig.toml",
  "bacon.toml",
]

[formatting]
align_entries = false
align_comments = false
array_auto_expand = true
array_auto_collapse = false
compact_arrays = true
column_width = 120
indent_string = "  "
reorder_keys = false
reorder_arrays = false

# Sort dependency tables by crate name. reorder_keys is scoped to dependency
# tables only, so every other table keeps its authored order.
[[rule]]
keys = [
  "dependencies",
  "dev-dependencies",
  "build-dependencies",
  "workspace.dependencies",
  "workspace.dev-dependencies",
  "workspace.build-dependencies",
  "target.*.dependencies",
  "target.*.dev-dependencies",
  "target.*.build-dependencies",
]

[rule.formatting]
reorder_keys = true
